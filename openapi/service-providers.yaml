openapi: 3.0.0
info:
  title: Service Providers API
  version: 1.0.0
  description: API specification for service-providers resource
servers:
- url: https://api.example.com
paths:
  /api/service-providers:
    servers: []
    get:
      x-slo:
        availability: 98.5
        latency:
          p95: 300
          p99: 400
          max: 1200
        throughput: 200
        status: DRAFT
      summary: List service providers [used by TSPs]
      description: "The following request enables a TSP to retrieve a list of the acceptor PSPs or consumer PSPs that it manages. \n## Scopes\nThe following scopes can access this route: `serviceProvider:management`,\
        \ `wallet:provisioning`, and `p2p:transferMoney`."
      operationId: get-service-providers
      parameters:
      - name: page
        description: The page to be retrieved.  If not specified, the default value is 0.
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        description: The maximum number of PSPs to be returned.  If not specified, the default value is 50.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: sort
        description: "Fields that can be used in the sorting are:\n\n| sortingParameter      | description                                                                      |\n|-----------------------|----------------------------------------------------------------------------------|\n\
          | name                  | The name of the service provider.                                                 |\n| email                 | The billing e-mail of the service provider.           \
          \                            |\n| supportsStandaloneApp | The flag that indicates if the service provider supports the Wero standalone app. |\n\nOptionally, it is possible to append \n`:asc` or\
          \ `:desc` to indicate the sorting direction. If nothing is \nspecified then the service providers are sorted by created date in descending\norder."
        in: query
        required: false
        schema:
          pattern: (name|email|supportsStandaloneApp):(asc|desc)$
          type: string
      security:
      - BearerAccessToken: []
      tags:
      - service-providers
      responses:
        '200':
          description: A collection of service providers that the TSP manages.
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceProviderCollectionResource'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '502':
          $ref: '#/components/responses/errorResponse502'
        '503':
          $ref: '#/components/responses/errorResponse503'
    post:
      x-slo:
        availability: 98.5
        latency:
          p95: 350
          p99: 600
          max: 1600
        throughput: 200
        status: DRAFT
      summary: Create a service provider [used by TSPs]
      operationId: post-service-provider
      description: "## Service providers\nThe following roles exist in the EPI payment system:\n\n - Acceptor payment service providers (acceptor PSPs), which provide payment services to EPI acceptors.\n\
        \ - Consumer payment service providers (consumer PSPs), which provide payment services to consumers.\n - Technical service providers (TSPs), which can provide technical services to consumer PSPs\
        \ or acceptor PSPs. A TSP might manage multiple consumer PSPs or multiple acceptor PSPs.\n\n\nEPI uses the term:\n\n - _'PSPs'_ to mean acceptor PSPs and consumer PSPs\n - _'service providers'_\
        \ to mean PSPs and TSPs\n\n\nSome service providers can hold more than one of the above roles in the EPI payment system. For example, a TSP could also be a consumer PSP.\n## Access to resources\n\
        Acceptors, acceptor PSPs, consumers and consumer PSPs can own resources at EPI central services.\n\n - Acceptor PSPs and consumer PSPs that are _not_ managed by a TSP can access the resources that\
        \ they own and some of their customers' resources.\n - Acceptor PSPs and consumer PSPs that _are_ managed by a TSP can permit the TSP to access their resources and some of their customers' resources.\
        \ With this access, the TSPs act on behalf of the acceptor PSPs or consumer PSPs.\n\n## Scope\nThe `serviceProvider:management` scope is required to access this route.\n## Creating a service provider\n\
        \n - At EPI central services, EPI can create service provider resources that correspond to acceptor PSPs, consumer PSPs, or TSPs.\n - In turn, TSPs can create Service Provider resources that correspond\
        \ to acceptor PSPs or consumer PSPs that the TSPs manage.\n\n\nThe following request enables a TSP to create a service provider resource that corresponds to an acceptor PSP or consumer PSP that\
        \ it manages."
      tags:
      - service-providers
      security:
      - BearerAccessToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceProviderRequest'
      responses:
        '201':
          description: Created
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceProviderResource'
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL that points to the service provider resource at EPI central services. For more information about this response header, see [MDN web documentation](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Location).
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '502':
          $ref: '#/components/responses/errorResponse502'
        '503':
          $ref: '#/components/responses/errorResponse503'
components:
  schemas:
    RSAPublicJWK:
      title: RSA Public Key
      type: object
      description: "Public key of an asymmetric RSA key pair.    \nRepresented as JSON Web Key ([JWK](https://www.rfc-editor.org/rfc/rfc7517))."
      properties:
        kid:
          type: string
          description: Key ID
          example: 74cf2532-c6c2-4586-acb3-6fce198acc5b
        kty:
          type: string
          description: 'Key Type: RSA or EC'
          const: RSA
        use:
          type: string
          description: Indicates whether a JWK is used for encrypting data or verifying the signature on data. Here, always `sig`.
          const: sig
        alg:
          type: string
          description: Identifies the algorithm intended for use with the key.
          enum:
          - RS256
          - RS384
          - RS512
        n:
          type: string
          description: Modulus. Base64Url encoded.
          example: vZl9LV2lmdaSn1CTfrpbIbkhuJZ4C-mb33JTSXGB9q7GuSW_eiFz5SUOK2p5JIXznabbazaywpYhyMBpw7tbnKSzBuQxRKQHPD-Li1hhV4abjr570hGmc0UyftpBWZz4_53-q6lp0hupi8getzDyfPiiDZvgyKIGHytYSvZCGeVHXzJQy6DNf2xyZxG8WwgKvpIcOi0FvlVDJgdlIQn3HGrW3xK1IJpHLzh_ucYDIhs4L864hdV2QzUZA7d_agbk7dbq7ZStZNF4J_KmbruouQ_edglZurKeh6xmiRcOqGfWqN-4gJXAT4gN6w_eslfkPAKRDOcyh4ig8GopQ6CD9w
        e:
          type: string
          description: Exponent. Base64Url encoded.
          example: AQAB
      required:
      - kid
      - kty
      - n
      - e
    BIC:
      type: string
      description: A Business Identifier Code (BIC). The BIC is an ISO 9362 standard for identifying business entities in the  financial industry. The BIC is also known as the SWIFT code.
      pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
      example: DEUTDEFF
    ConsumerPSPRole:
      type: object
      title: Consumer PSP role
      description: Indicates that the service provider has the role of consumer PSP.
      required:
      - type
      properties:
        type:
          type: string
          description: The type of service provider. This property is a discriminator; its value must be `consumer-psp`.
          const: consumer-psp
          example: consumer-psp
        apiAccess:
          type: boolean
          description: Specifies whether the consumer PSP is permitted to access the EPI central services API.
          default: false
    ServiceProviderContact:
      type: object
      description: Contact information that the service provider registers with EPI. This data is used in the administrative section of EPICentre.
      properties:
        name:
          type: string
          description: Contact name.
          example: Alejandro
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          description: Contact mobile phone number. Must be a valid mobile phone number in E.164 format.
          pattern: ^\+\d{5,25}$
          minLength: 6
        email:
          type: string
          description: Contact email address.
          format: email
          minLength: 1
          maxLength: 255
          example: user@example.com
      example:
        name: Alejandro
        phoneNumber: '+346569746'
        email: example-mail@gmail.com
      required:
      - name
      - phoneNumber
      - email
    CreateServiceProviderRequest:
      type: object
      required:
      - name
      - roles
      properties:
        name:
          type: string
          description: The name of the payment service provider.
          minLength: 1
          maxLength: 255
          example: My payment service provider
        businessIdentifierCode:
          description: The BIC of the service provider.
          $ref: '#/components/schemas/BIC'
        contact:
          $ref: '#/components/schemas/ServiceProviderContact'
        roles:
          type: array
          description: The roles of the payment service provider.  Each object can be an acceptor PSP or consumer PSP. If no role is provided, `roles` sets to `false` by default.
          minItems: 1
          items:
            type: object
            oneOf:
            - $ref: '#/components/schemas/AcceptorPSPRole'
            - $ref: '#/components/schemas/ConsumerPSPRole'
            example:
              type: consumer-psp
              apiAccess: true
        groupId:
          type: string
          description: 'The group that the payment service provider belongs to in accordance with the TSP''s specifications. TSPs can use this parameter to group PSPs that they manage. '
          minLength: 1
          maxLength: 255
          example: group-id
        externalId:
          type: string
          description: 'An external identifier of the service provider. TSPs can add  their own internal identifier of the PSPs they manage as a reference. '
          minLength: 1
          maxLength: 255
          example: external-id
        managedScope:
          type: array
          description: "The scope of the actions that the TSP can perform on behalf of the payment service provider. **Attention**: If `null`, the TSP can perform, by default, the entire scope of the actions\
            \ that the consumer PSP or acceptor PSP would normally perform.\n\nScope for actions that a consumer PSP would normally perform:\n - 'p2p:transferMoney' (actions relating to making person-to-person\
            \ payments)\n - 'wallet:provisioning' (actions relating to wallet provisioning)\n\nScope for actions that an acceptor PSP would normally perform: \n - 'consent:request' (actions relating to\
            \ requesting consumers to consent to payment plans)\n - 'payment:request' (actions relating to requesting consumer PSPs to make payments)"
          minItems: 1
          items:
            type: string
            description: The scope of TSP actions.
            example: payment:request
        integrationParameters:
          type: array
          description: The integration parameters of the payment service provider. For each role that is defined in the `roles` field, not more than one set of integration parameters can be specified.
          minItems: 1
          items:
            anyOf:
            - $ref: '#/components/schemas/AcceptorPSPIntegrationParameters'
            - $ref: '#/components/schemas/ConsumerPSPIntegrationParameters'
        designData:
          $ref: '#/components/schemas/ServiceProviderDesignData'
          deprecated: true
        status:
          type: object
          description: Status of the payment service provider.
          default:
            value: Active
          properties:
            value:
              $ref: '#/components/schemas/ServiceProviderStatus'
        reconciliationReportEncryptionCertificate:
          type: string
          description: A certificate, in PEM format, that contains the public key that is used to encrypt the reconciliation report. The certificate must be S/MIME compliant. Its public key must be either
            RSA-2048 or stronger, or EC/ECDSA P-256 or stronger. There are no additional requirements on the PKI so that self-signed certificates are accepted.
      example:
        name: Test Service Provider
        businessIdentifierCode: DEUTDEFF
        contact:
          name: Alejandro
          phoneNumber: '+346569746'
          email: example-mail@gmail.com
        roles:
        - type: consumer-psp
          apiAccess: false
        groupId: groupId
        managedScope:
        - wallet:provisioning
        - p2p:transferMoney
        status:
          value: Active
        integrationParameters:
        - type: consumer-psp-integration-parameters
          baseUrl: https://example.com
          excludeBaseUrlPathFromSignature: false
          countryCodes:
          - ES
          enableNotificationsAPI: true
          notificationPreference:
            language: en
            speechPattern: Formal
          supportsStandaloneApp: true
          apps:
          - name: app1
            id: 1d5c2379-86d4-4a09-ab4b-8ebd49d5ed00
            icon:
              type: image/png
              contentBase64: base64
            monochromaticIcon:
              type: image/png
              contentBase64: base64
            primaryColor: '#FFFFFF'
            links:
              deep: https://example.com/app1/deeplink
              web: https://website.example.com
              universal: https://example.com/app1/universallink
          supportedRoutes:
          - PaymentValidation
        designData:
          icon:
            type: image/png
            contentBase64: base64
          monochromaticIcon:
            type: image/png
            contentBase64: base64
          primaryColor: '#FFFFFF'
        reconciliationReportEncryptionCertificate: '-----BEGIN CERTIFICATE----- MIIDIjCCAgoCCQC9cpNbfbY7KTANBgkqhkiG9w0BAQsFADBTMQswCQYDVQQGEwJ1 czEMMAoGA1UECAwDZm9vMQwwCgYDVQQHDANmb28xDDAKBgNVBAoMA2ZvbzEMMAoG
          A1UECwwDZm9vMQwwCgYDVQQDDANmb28wHhcNMjYwMjEzMTY0MzM3WhcNMjcwMjEz MTY0MzM3WjBTMQswCQYDVQQGEwJ1czEMMAoGA1UECAwDZm9vMQwwCgYDVQQHDANm b28xDDAKBgNVBAoMA2ZvbzEMMAoGA1UECwwDZm9vMQwwCgYDVQQDDANmb28wggEi
          MA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQDqjysEItdX2LJW5HoIqKOhipQQ XTDM1d+0h0NjtwiuhgAIreVCVmM8plekqVt11JwpvV1Z8xVlvcthhpfxuXFNR0V3 K8fgdSi/eU9dqIy6ri5/sI+MqsNQIfa22elCmG2OtC1xASN3ONxzo2h/bOYzyDPK
          1uNGL6iIeavqi4SP3Df9myG/jY98h6Wo6B+NxuBjGGDDBN7LJlWEmtTCtELIbmuD /QpewHPqFbuoy4fs/ZqaNNAI8QOZ4knnAmLwYepBbraMyRvXVhiClzXDjs6um12H cx6JNhfOg+gZzg7BUP4a06xNHF03xIbdTF8ZFsk6aQ6KDkmeHcend9AsRt7pAgMB
          AAEwDQYJKoZIhvcNAQELBQADggEBABOIGRm3ActcIfK4SZ6mqLPyf8G5P4DeCh8G kRfd/ZNBn4VdvTnom4t0sDqDsUaMU0VMJAIKVTy/YwAbX8lT229Pvi1vkVDUoxm+ QzWnzZQ95bIqaNQQU+OVTvabYNnCP1Czcl6IdDn822qcRJT/8DrSqe4HE3V5rDnt
          4xcjfxHVoZjc5RQyTqpwma64OL72R10R3hsQ2jpwDKEybfQcxmwtFmhEt26pCC/J 45CYYB+8NwasipKdPvklgPEM85leg62HaPUZQWUHPQfGOVVMpRCg7fqI1pKwOw8M JKg6Gv7up/ShC34OSItp2oT57T7rq4TEE52DtLp6O8t2WceJMgo= -----END
          CERTIFICATE-----'
    ServiceProviderManagement:
      type: object
      properties:
        managerServiceProviderId:
          type: string
          description: The ID of the TSP that manages the payment service provider.
          format: uuid
          example: 00000000-0000-0000-0000-000000009000
        name:
          type: string
          description: The name of the TSP that manages the payment service provider.
          example: Acme-Bank
        managedScope:
          type: array
          description: The scope of the actions that the TSP can perform on behalf of the payment service provider. If no scope is specified, the TSP can perform the entire scope of the actions that are
            normally performed by the payment service provider.
          items:
            type: string
            description: The scope of the actions that the TSP can perform on behalf of the payment service provider.
            minLength: 1
          minItems: 1
      required:
      - managerServiceProviderId
      - name
