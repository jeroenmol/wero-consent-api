    ServiceProviderPublicKey:
      title: Public key of the service provider.
      type: object
      description: 'Public key of the service provider. The key must be unique to the service provider.

        Represented as JSON Web Key ([JWK](https://www.rfc-editor.org/rfc/rfc7517)).'
      oneOf:
      - $ref: '#/components/schemas/RSAPublicJWK'
      - $ref: '#/components/schemas/EllipticCurvePublicJWK'
      discriminator:
        propertyName: kty
        mapping:
          RSA: '#/components/schemas/RSAPublicJWK'
          EC: '#/components/schemas/EllipticCurvePublicJWK'
    ServiceProviderResource:
      type: object
      title: Service provider
      description: 'Service providers can perform actions for themselves or on behalf of other service providers. For example, a TSP can perform actions on behalf of a consumer PSP.

        The roles of acceptor PSP and consumer PSP entail default scopes of the actions that can be performed. The addition of other actions can also be requested.'
      properties:
        id:
          type: string
          description: The ID of the service provider.
          format: uuid
          example: 00000000-0000-0000-0000-000000009000
        name:
          type: string
          description: The name of the service provider.
          minLength: 1
          maxLength: 255
          example: My Consumer-Payment-Service-Provider
        businessIdentifierCode:
          description: The BIC of the service provider.
          $ref: '#/components/schemas/BIC'
        contact:
          $ref: '#/components/schemas/ServiceProviderContact'
        roles:
          type: array
          description: The roles of the service provider.
          minItems: 1
          items:
            anyOf:
            - $ref: '#/components/schemas/AcceptorPSPRole'
            - $ref: '#/components/schemas/ConsumerPSPRole'
            - $ref: '#/components/schemas/TechnicalSPRole'
        publicKeys:
          type: array
          description: The public keys of the service provider.
          items:
            $ref: '#/components/schemas/ServiceProviderPublicKey'
        reconciliationReportEncryptionCertificate:
          type: string
          description: A certificate, in PEM format, that contains the public key that is used to encrypt the reconciliation report.
        scope:
          type: array
          description: The scope of the actions of the service provider.
          items:
            type: string
            description: The scope of the actions of the service provider.
            minLength: 1
            maxLength: 255
            example: payment:request
        status:
          type: object
          description: Status of the service provider.
          properties:
            value:
              $ref: '#/components/schemas/ServiceProviderStatus'
        groupId:
          type: string
          description: The group that the service provider belongs to. TSPs can use this parameter to group PSPs that they manage.
          minLength: 1
          maxLength: 255
          example: group-id
        externalId:
          type: string
          description: 'An external identifier of the service provider. TSPs can add  their own internal identifier of the PSPs they manage as a reference. '
          minLength: 1
          maxLength: 255
          example: external-id
        managements:
          type: array
          description: The other service providers that access EPI central services on behalf of this service provider.
          items:
            $ref: '#/components/schemas/ServiceProviderManagement'
        integrationParameters:
          type: array
          description: The integration parameters of the service provider.
          items:
            anyOf:
            - $ref: '#/components/schemas/AcceptorPSPIntegrationParameters'
            - $ref: '#/components/schemas/ConsumerPSPIntegrationParameters'
            - $ref: '#/components/schemas/TechnicalSPIntegrationParameters'
        designData:
          $ref: '#/components/schemas/ServiceProviderDesignData'
          deprecated: true
        consumerPspDelegations:
          type: array
          description: The consumer PSP IDs that this service provider can act on behalf of.
          items:
            type: string
            description: The ID of the consumer PSP.
            format: uuid
            example: 00000000-0000-0000-0000-000000009000
        logoAssetId:
          type: string
          description: The asset ID of the logo of the service provider.
          format: uuid
          example: c5c4b93d-012d-429a-939c-d951c753c919
        createdAt:
          type: string
          format: date-time
          description: 'Date and time at which the service provider was created. (Format: Timestamp)'
        _links:
          type: object
          description: HAL links to related resources.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/link'
      required:
      - id
      - name
      - roles
      - scope
      - status
      - createdAt
      - _links
      example:
        id: b47ee339-9575-4d08-9b7e-73b49097e823
        name: Test Service Provider
        businessIdentifierCode: DEUTDEFF
        contact:
          name: Alejandro
          phoneNumber: '+346569746'
          email: example-mail@gmail.com
        roles:
        - type: consumer-psp
          apiAccess: true
        scope:
        - wallet:provisioning
        - p2p:transferMoney
        - payment:request
        status:
          value: Active
