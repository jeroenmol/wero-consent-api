          description: The type of service provider. This is a discriminator property; its value must be `acceptor-psp`.
          const: acceptor-psp
          example: acceptor-psp
        apiAccess:
          type: boolean
          description: Specifies whether the acceptor PSP is permitted to access the EPI central services API.
          default: false
    TechnicalSPRole:
      type: object
      title: Technical service provider role
      description: Indicates that the service provider has the role of technical service provider.
      required:
      - type
      properties:
        type:
          type: string
          description: The type of service provider. This property is a discriminator; its value must be `technical-service-provider`.
          const: technical-service-provider
          example: technical-service-provider
        apiAccess:
          type: boolean
          description: Specifies whether the TSP is permitted to access the EPI central services API.
          default: true
    EllipticCurvePublicJWK:
      title: Elliptic Curve Public Key
      type: object
      description: "Public key of an asymmetric elliptic-curve key pair.  \nRepresented as  JSON Web Key (JWK) https://www.rfc-editor.org/rfc/rfc7517"
      properties:
        kid:
          type: string
          description: Key ID
          example: 74cf2532-c6c2-4586-acb3-6fce198acc5b
        kty:
          type: string
          description: 'Key Type: RSA or EC'
          const: EC
        use:
          type: string
          description: Indicates whether a JWK is used for encrypting data or verifying the signature on data. Here, always `sig`.
          const: sig
        alg:
          type: string
          description: Identifies the algorithm intended for use with the key.
          enum:
          - ES256
          - ES384
          - ES512
        crv:
          type: string
          description: Name of selected curve
          enum:
          - P-256
          - P-384
          - P-521
        x:
          type: string
          description: X Coordinate
        y:
          type: string
          description: Y Coordinate
      required:
      - kid
      - kty
      - crv
      - x
      - y
