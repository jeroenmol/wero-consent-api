openapi: 3.0.0
info:
  title: Payment Sources API
  version: 1.0.0
  description: API specification for payment-sources resource
servers:
- url: https://api.example.com
paths:
  /api/payment-sources:
    servers: []
    post:
      tags:
      - payment-sources
      operationId: post-payment-sources
      summary: Create a payment source resource [Consumer PSP]
      x-slo:
        availability: 99.95
        latency:
          p95: 300
          p99: 600
          max: 1800
        throughput: N/A
        severity: N/A
        status: DRAFT
      description: "Consumer PSPs can use this endpoint call to send information about a consumer's payment source to EPI central services and create a payment source resource.\n## Scope \nThis endpoint\
        \ call does not require a scope. "
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentSourceRequest'
      responses:
        '201':
          description: Created
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PaymentSourceResource'
        '208':
          description: Already Reported - The payment source with the given externalId already exists and has not been changed.
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PaymentSourceResource'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '409':
          description: 'Conflict

            The submitted payment source does not match the existing payment source, or a constraint is violated.  For example, the IBAN might already be in use, or the account holder might not match. Ensure
            that the combination of IBAN and externalId remains unique.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                TenantIdAlreadyInUse:
                  description: The submitted payment source was submitted before and does not match the existing payment source.
                  value:
                    type: /problem/payment-source/tenant-id-already-in-use
                    status: 409
                    title: Constraint Violation
                    detail: The provided consumerPspId + externalId combination is already in use.
                    callId: 00000000000000000000000000000000-0000000000000000
                IbanAlreadyInUse:
                  value:
                    type: /problem/payment-source/iban-already-in-use
                    status: 409
                    title: Constraint Violation
                    detail: The provided IBAN is already in use.
                    callId: 00000000000000000000000000000000-0000000000000000
                IbanAliasAlreadyInUse:
                  value:
                    type: /problem/payment-source/iban-alias-already-in-use
                    status: 409
                    title: Constraint Violation
                    detail: The provided consumerPspId + IBAN alias combination is already in use.
                    callId: 00000000000000000000000000000000-0000000000000000
        '422':
          description: Unprocessable Entity - The request was well formed but was not followed due to semantic errors.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                PaymentSourceBlocked:
                  description: This payment source is blocked.
                  value:
                    type: about:blank
                    status: 422
                    title: Unprocessable Entity
                    detail: Payment source with ID 00000000-0000-0000-0000-000000000000 is blocked.
                    callId: 00000000000000000000000000000000-0000000000000000
                ConsumerPspIsBeingMerged:
                  value:
                    type: /problem/consumer-psp/consumer-psp-is-being-merged
                    status: 422
                    title: Consumer PSP is being merged
                    callId: 00000000000000000000000000000000-0000000000000000
      security:
      - BearerAccessToken: []
    get:
      operationId: get-payment-sources
      summary: List payment sources [Consumer PSP]
      description: 'Consumer PSPs can use this endpoint call to retrieve a list of the payment source resources that it created at EPI central services.

        ## Scope

        This endpoint call does not require a scope.'
      security:
      - BearerAccessToken: []
      tags:
      - payment-sources
      parameters:
      - name: id
        description: The ID of the payment source.
        in: query
        required: false
        explode: true
        schema:
          type: string
          format: uuid
      - name: externalId
        description: The external ID of the payment source.
        in: query
        required: false
        explode: true
        schema:
          type: string
      - name: status
        description: The status of the payment source.  If not specified, the default value is Active.
        in: query
        required: false
        explode: true
        schema:
          type: string
          default: Active
          enum:
          - Active
          - Blocked
          - Closed
      - name: page
        description: The page that is to be retrieved.  If not specified, the default value is `0`.
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        description: The maximum number of payment sources to return.  If not specified, the default value is 100.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/hal+json; charset=UTF-8:
              schema:
                type: object
                required:
                - _links
                - _embedded
                - page
                properties:
                  _links:
                    $ref: '#/components/schemas/PagedCollectionResourceLinks'
                  _embedded:
                    type: object
                    properties:
                      paymentSources:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentSourceResource'
                  page:
                    $ref: '#/components/schemas/page'
              examples:
                page:
                  value:
                    _links:
                      self:
                        href: https://api.epi-services.eu/api/payment-sources?page=0&limit=100
                      first:
                        href: https://api.epi-services.eu/api/payment-sources?page=0&limit=100
                      last:
                        href: https://api.epi-services.eu/api/payment-sources?page=0&limit=100
                    _embedded:
                      paymentSources:
                      - type: PaymentAccount
                        id: 00000000-0000-0000-0000-000000000001
                        status: Active
                        consumerPspId: 8aff7e82-40c7-4715-ae9b-0be5fb3cb365
                        externalId: 6ae125d9-13b1-5add-9999-82e1a40cbb39
                        currency: EUR
                        accountIdentifier:
                          type: IBAN
                          iban: DE57100110012620341753
                        accountHolder: Lina Cash
                        pro: false
                        displayDigits: DE57xxxxxxxxxxxxxx1753
                        _links:
                          self:
                            href: https://api.epi-services.eu/api/payment-sources/00000000-0000-0000-0000-000000000001
                    page:
                      size: 1
                      totalElements: 1
                      totalPages: 1
                      number: 0
                      requestedPageSize: 100
                      limitReached: false
        '400':
          $ref: '#/components/responses/errorResponse400'
        '403':
          $ref: '#/components/responses/errorResponse403'
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that uniquely identifies the problem type, only in the context of the provided endpoint.
          default: about:blank
          example: /some/uri-reference
          not:
            enum:
            - /problem/constraint-violation
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: some title for the error situation
        status:
          type: integer
          format: int32
          description: The 'status' member is only advisory; it conveys the HTTP status code used for the convenience of the consumer. This attribute is always the same as the status code in the actual
            HTTP response.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem, which helps locate the problem and describes how to proceed.
          example: some description for the error situation
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem, for example, by adding a fragment identifier or sub-path to the problem type. Can be used to locate the root
            of the problem in the source code.
          example: /some/uri-reference#specific-occurrence-context
        callId:
          type: string
          description: A call ID that identifies the specific occurrence of the problem.
          example: 00000000000000000000000000000000-0000000000000000
      required:
      - type
      - title
      - status
    PaymentSourceStatus:
      description: The status of the payment source. This enumeration is extensible; additional values might be added.
      oneOf:
      - const: Active
        description: The payment source is active.
        title: Active
      - const: Blocked
        description: The payment source is blocked.
        title: Blocked
      - const: Closed
        description: The payment source is closed.
        title: Closed
      - type: string
        not:
          enum:
          - Active
          - Blocked
          - Closed
        description: Placeholder for a future reason, to be defined.
        title: Any String
    page:
      type: object
      examples:
      - size: 1
        totalElements: 1
        totalPages: 1
        number: 0
        requestedPageSize: 10
        limitReached: false
      properties:
        size:
          type: integer
          description: The number of elements on the page.
        totalElements:
          type: integer
          description: The total number of elements available with the query.
        totalPages:
          type: integer
          description: The total number of pages available, using the requested page size.
        number:
          type: integer
          description: The number of the current page. Page numbers start at `0` and continue to the total number of pages.
        requestedPageSize:
          type: integer
          description: The requested page size. The value of "size" might differ for the last page if the last page is not full.
        limitReached:
          type: boolean
          description: If `true`, an internal limit when retrieving results was exceeded. Not all elements are returned.
      description: A paginated resource is a HAL resource. The resource contains the page object, which describes the provided subset of data. The data is provided as an embedded collection resource. The
        name of the collection depends on the endpoint. HAL links are also provided, for navigation.
      title: Structure of a paginated response
      required:
      - size
      - totalElements
      - totalPages
      - number
      - requestedPageSize
      - limitReached
    PaymentSourceResource:
      type: object
      description: ''
      oneOf:
      - $ref: '#/components/schemas/PaymentSourceResourcePaymentAccount'
      discriminator:
        propertyName: type
        mapping:
          PaymentAccount: '#/components/schemas/PaymentSourceResourcePaymentAccount'
    IBAN:
      type: string
    CreatePaymentSourceRequest:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CreatePaymentSourcePaymentAccountRequest'
      examples:
      - type: PaymentAccount
        externalId: '123456789'
        accountIdentifier:
          type: IBAN
          iban: NL02ABNA0123456789
        accountHolder: John Doe
        currency: EUR
        pro: false
        countryCode: NL
      - type: PaymentAccount
        externalId: '123456789'
        accountIdentifier:
          type: Alias
          alias: MyAlias123
          maskedIban: NL02xxxxxxxxxxxxxx89
        accountHolder: John Doe
        currency: EUR
        pro: false
        countryCode: NL
