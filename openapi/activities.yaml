          default: 400
        callId:
          type: string
          description: A call ID that identifies the specific occurrence of the problem.
          example: 00000000000000000000000000000000-0000000000000000
        violations:
          type: array
          description: A list of constraint violations.
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
                description: The name of the field that caused the constraint violation.
              message:
                type: string
                description: A technical message that describes the constraint violation, in English.
              userMessageKey:
                type: string
                description: A key that describes the type of constraint violation, useful to report user input validation error. The key can be used to look up a localised message for instance, that can
                  then be interpolated using the `userMessageValue`.
                example: constraint.string.min-length
                oneOf:
                - type: string
                  title: Standard constraint violation key
                  description: 'All known standard constraint violation keys: * **constraint.required**: The field is required. * **constraint.type**: The field must be of the correct type. * **constraint.enum**:
                    The field must be one of the allowed values. `userMessageValue` contains the list as a string value. * **constraint.const**: The field must be a specific value. `userMessageValue` contains
                    the value as a string value. * **constraint.number.multiple-of**: The field must be a multiple of a specific number. `userMessageValue` contains the number as a string value. * **constraint.number.maximum-inclusive**:
                    The field must be less than or equal to a specific number. `userMessageValue` contains the number as a string value. * **constraint.number.maximum-exclusive**: The field must be less
                    than a specific number. `userMessageValue` contains the number as a string value. * **constraint.number.minimum-inclusive**: The field must be greater than or equal to a specific number.
                    `userMessageValue` contains the number as a string value.            * **constraint.number.minimum-exclusive**: The field must be greater than a specific number. `userMessageValue` contains
                    the number as a string value. * **constraint.string.max-length**: The field must be at most a specific number of characters long. `userMessageValue` contains the number as a string value.
                    * **constraint.string.min-length**: The field must be at least a specific number of characters long. `userMessageValue` contains the number as a string value. * **constraint.string.min-length-not-blank**:
                    The field must be at least a specific number of characters long and not blank. `userMessageValue` contains the number as a string value. * **constraint.string.max-graphemes**: The field
                    must be at most a specific number of graphemes long. `userMessageValue` contains the number as a string value. * **constraint.string.pattern**: The field must match a specific pattern.
                    * **constraint.string.length**: The field must be a specific number of characters long. `userMessageValue` contains the number as a string value. * **constraint.string.url**: The field
                    must be a valid URL. * **constraint.string.url-https**: The field must be a valid HTTPS URL. * **constraint.string.uuid4**: The field must be a valid UUID v4. * **constraint.string.email**:
                    The field must be a valid email address. * **constraint.string.phone-number**: The field must be a valid phone number. * **constraint.duration.min-seconds**: The field must be at least
                    a specific number of seconds long. `userMessageValue` contains the number as a string value. * **constraint.duration.max-days**: The field must be at most a specific number of days long.
                    `userMessageValue` contains the number as a string value. * **constraint.datetime.before**: The field must be before a specific date and time. `userMessageValue` contains the `datetime`
                    as a timestamp string value. * **constraint.array.min-items**: The field must contain at least a specific number of items. `userMessageValue` contains the number as a string value. *
                    **constraint.array.max-items**: The field must contain at most a specific number of items. `userMessageValue` contains the number as a string value. * **constraint.array.unique-items**:
                    The field must contain only unique items. * **constraint.amount.maximum**: The field must be less than or equal to a specific amount. * **constraint.amount.minimum**: The field must
                    be greater than or equal to a specific amount. * **constraint.currency-supported**: The field must be a supported currency.'
                  enum:
                  - constraint.required
                  - constraint.type
                  - constraint.enum
                  - constraint.const
                  - constraint.number.multiple-of
                  - constraint.number.maximum-inclusive
                  - constraint.number.maximum-exclusive
                  - constraint.number.minimum-inclusive
                  - constraint.number.minimum-exclusive
                  - constraint.string.max-length
                  - constraint.string.min-length
                  - constraint.string.min-length-not-blank
                  - constraint.string.max-graphemes
                  - constraint.string.pattern
                  - constraint.string.length
                  - constraint.string.url
                  - constraint.string.url-https
                  - constraint.string.uuid4
                  - constraint.string.email
                  - constraint.string.phone-number
                  - constraint.duration.min-seconds
                  - constraint.duration.max-days
                  - constraint.datetime.before
                  - constraint.array.min-items
                  - constraint.array.max-items
                  - constraint.array.unique-items
                  - constraint.amount.maximum
                  - constraint.amount.minimum
                  - constraint.currency-supported
                - type: string
                  description: Placeholder for a future user message key.
                  title: Placeholder for future message keys
                  not:
                    enum:
                    - constraint.required
                    - constraint.type
                    - constraint.enum
                    - constraint.const
                    - constraint.number.multiple-of
                    - constraint.number.maximum-inclusive
                    - constraint.number.maximum-exclusive
                    - constraint.number.minimum-inclusive
                    - constraint.number.minimum-exclusive
                    - constraint.string.max-length
                    - constraint.string.min-length
                    - constraint.string.min-length-not-blank
                    - constraint.string.max-graphemes
                    - constraint.string.pattern
                    - constraint.string.length
                    - constraint.string.url
                    - constraint.string.url-https
                    - constraint.string.uuid4
                    - constraint.string.email
                    - constraint.string.phone-number
                    - constraint.duration.min-seconds
                    - constraint.duration.max-days
                    - constraint.datetime.before
                    - constraint.array.min-items
                    - constraint.array.max-items
                    - constraint.array.unique-items
                    - constraint.amount.maximum
                    - constraint.amount.minimum
                    - constraint.currency-supported
              userMessageValue:
                type: string
                description: A string value that can be used to replace a placeholder in the localised message.
      required:
      - type
      - title
      - status
      - violations
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that uniquely identifies the problem type, only in the context of the provided endpoint.
          default: about:blank
          example: /some/uri-reference
          not:
            enum:
            - /problem/constraint-violation
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: some title for the error situation
        status:
          type: integer
          format: int32
          description: The 'status' member is only advisory; it conveys the HTTP status code used for the convenience of the consumer. This attribute is always the same as the status code in the actual
            HTTP response.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem, which helps locate the problem and describes how to proceed.
          example: some description for the error situation
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem, for example, by adding a fragment identifier or sub-path to the problem type. Can be used to locate the root
            of the problem in the source code.
          example: /some/uri-reference#specific-occurrence-context
        callId:
          type: string
          description: A call ID that identifies the specific occurrence of the problem.
          example: 00000000000000000000000000000000-0000000000000000
      required:
      - type
      - title
      - status
    P2PPaymentPayerHistoryItems:
      type: object
      description: A summary representation of an activity.
      oneOf:
      - $ref: '#/components/schemas/P2PPaymentCreatedHistoryItem'
      - $ref: '#/components/schemas/P2PPaymentSentHistoryItem'
      - $ref: '#/components/schemas/P2PPaymentRejectedHistoryItem'
      - $ref: '#/components/schemas/P2PPaymentFailedHistoryItem'
      - $ref: '#/components/schemas/P2PPaymentSettledHistoryItem'
      - $ref: '#/components/schemas/P2PPaymentExpiredHistoryItem'
      - $ref: '#/components/schemas/P2PPaymentCancelledHistoryItem'
      discriminator:
        propertyName: type
        mapping:
          Created: '#/components/schemas/P2PPaymentCreatedHistoryItem'
          Sent: '#/components/schemas/P2PPaymentSentHistoryItem'
          Rejected: '#/components/schemas/P2PPaymentRejectedHistoryItem'
          Failed: '#/components/schemas/P2PPaymentFailedHistoryItem'
          Settled: '#/components/schemas/P2PPaymentSettledHistoryItem'
          Expired: '#/components/schemas/P2PPaymentExpiredHistoryItem'
          Cancelled: '#/components/schemas/P2PPaymentCancelledHistoryItem'
    P2PPaymentOriginatorInfo:
      type: object
      description: Information about the originator of a P2P payment.
      required:
      - consumerId
      - paymentSourceId
      properties:
        consumerId:
          type: string
          format: uuid
          description: The ID of the P2P payment originator.
        paymentSourceId:
          type: string
          format: uuid
          description: The ID of the payment source that was used to settle the payment.
    P2POpenRequestPayerSummary:
      type: object
      description: A p2p open request has been paid.
      allOf:
      - $ref: '#/components/schemas/P2PActivitySummary'
      - type: object
        required:
        - type
        - payers
        - payee
        - cancelled
        - declined
        - expired
        - expiresAt
        properties:
          type:
            type: string
            const: P2POpenRequestPayerSummary
          category:
            type: string
            const: P2P
          payerIds:
            type: array
            items:
              $ref: '#/components/schemas/P2POpenRequestRecipientInfo'
          payee:
            description: The payee's information.
            $ref: '#/components/schemas/P2PCounterpartyInfo'
          cancelled:
            type: boolean
            description: Indicates whether the open request has been cancelled.
          declined:
            type: boolean
            description: Indicates whether the open request has been declined by the payer.
          expired:
            type: boolean
            description: Indicates whether the open request has expired.
          expiresAt:
            format: date-time
            type: string
            description: The date and time at which the P2P open request expires. After expiration, the P2P request cannot be used to make payments.
            example: '2025-01-01T10:20:30.061200Z'
          _links:
            type: object
            required:
            - self
            properties:
              self:
                $ref: '#/components/schemas/link'
                description: A link to this activity.
              approval:
                $ref: '#/components/schemas/link'
                description: Approve a payment for the P2P open request.
              rejection:
                $ref: '#/components/schemas/link'
                description: 'Reject the P2P open request.                 '
    EventDependentReservationSummary:
      type: object
      description: An event-dependent payment request has been created.
      allOf:
      - $ref: '#/components/schemas/BaseSummary'
      - type: object
        required:
        - type
        - category
        - amount
        - shop
        - merchantCategoryCode
        - authorisationId
        - cancelled
        - failed
        properties:
          type:
            type: string
            const: EventDependentReservation
          category:
            type: string
            const: ECommerce
          amount:
            $ref: '#/components/schemas/Money'
          remainingReservedAmount:
            $ref: '#/components/schemas/Money'
            description: 'The remaining amount that can be captured from the reservation if the reservation has not yet been marked as final.

              '
          paymentSourceId:
            type: string
            format: uuid
            description: The ID of the payment source.
          shop:
            $ref: '#/components/schemas/Shop'
          merchantCategoryCode:
            $ref: '#/components/schemas/MerchantCategoryCode'
            description: 'The merchant category code of the merchant from which the purchase was made.  See ISO 18245:2023 for more information on available merchant category codes.


              Consumer PSPs can use this information to show a logo or provide contextual information when displaying the activity to the consumer.'
          authorisationId:
            type: string
            description: The [ID of the authorisation]ref:create-consumer-psp-authorisation) that is given to the consumer PSP when the payment request has been created. Consumer PSPs can use this field
              to link an EPI activity to their SEPA transaction.
          cancelled:
            type: boolean
            description: True, if either the acceptor cancelled the event-dependent payment or if the acceptor did not capture the entire amount before the consent expired.
          failed:
            type: boolean
            description: True, if the authorisation has been rejected or has failed.
          _links:
            type: object
            required:
            - self
            properties:
              self:
                allOf:
                - $ref: '#/components/schemas/link'
                  description: 'A link to the details of the activity.

                    '
    ActivitySummary:
      type: object
      description: A summary representation of an activity.
      oneOf:
      - $ref: '#/components/schemas/SingleImmediatePaymentSummary'
      - $ref: '#/components/schemas/EventDependentCaptureSummary'
      - $ref: '#/components/schemas/EventDependentReservationSummary'
      - $ref: '#/components/schemas/RefundSummary'
      - $ref: '#/components/schemas/SubscriptionPaymentSummary'
      - $ref: '#/components/schemas/P2PPaymentPayerSummary'
      - $ref: '#/components/schemas/P2PPaymentPayeeSummary'
      - $ref: '#/components/schemas/P2PPaymentPayerAndPayeeSummary'
      - $ref: '#/components/schemas/P2PRequestPayerSummary'
      - $ref: '#/components/schemas/P2PRequestPayeeSummary'
      - $ref: '#/components/schemas/P2POpenRequestPayerSummary'
      - $ref: '#/components/schemas/P2POpenRequestPayeeSummary'
      discriminator:
        propertyName: type
        mapping:
          SingleImmediatePayment: '#/components/schemas/SingleImmediatePaymentSummary'
          EventDependentCapture: '#/components/schemas/EventDependentCaptureSummary'
          EventDependentReservation: '#/components/schemas/EventDependentReservationSummary'
          Refund: '#/components/schemas/RefundSummary'
          SubscriptionPayment: '#/components/schemas/SubscriptionPaymentSummary'
          P2PPaymentPayerSummary: '#/components/schemas/P2PPaymentPayerSummary'
          P2PPaymentPayeeSummary: '#/components/schemas/P2PPaymentPayeeSummary'
          P2PPaymentPayerAndPayeeSummary: '#/components/schemas/P2PPaymentPayerAndPayeeSummary'
          P2PRequestPayerSummary: '#/components/schemas/P2PRequestPayerSummary'
          P2PRequestPayeeSummary: '#/components/schemas/P2PRequestPayeeSummary'
          P2POpenRequestPayerSummary: '#/components/schemas/P2POpenRequestPayerSummary'
          P2POpenRequestPayeeSummary: '#/components/schemas/P2POpenRequestPayeeSummary'
    EComOriginatorPspReference:
      type: string
      description: The consumer PSP's reference of the originator of the payment (SEPA scheme attribute T054). Consumer PSPs can use this field to link an EPI activity to their SEPA transaction. Note that
        this value is available only after the consumer PSP has marked the capture as settled.
    link:
      type: object
      properties:
        href:
          type: string
          format: uri
        name:
          type: string
      required:
      - href
    PaymentPlan:
      type: object
      description: The initial payment plan consented by the consumer.
      oneOf:
      - $ref: '#/components/schemas/SingleImmediatePaymentPlan'
      - $ref: '#/components/schemas/C2cPaymentPlan'
      - $ref: '#/components/schemas/EventDependentPaymentPlan'
      - $ref: '#/components/schemas/SubscriptionPaymentPlan'
      - $ref: '#/components/schemas/ConsumerPresentFuturePaymentPlan'
      discriminator:
        propertyName: type
        mapping:
          SingleImmediate: '#/components/schemas/SingleImmediatePaymentPlan'
          C2c: '#/components/schemas/C2cPaymentPlan'
          EventDependent: '#/components/schemas/EventDependentPaymentPlan'
          Subscription: '#/components/schemas/SubscriptionPaymentPlan'
          ConsumerPresentFuturePayment: '#/components/schemas/ConsumerPresentFuturePaymentPlan'
    SubscriptionPaymentSummary:
      type: object
      description: A subscription payment has been made.
      allOf:
      - $ref: '#/components/schemas/BaseSummary'
      - type: object
        required:
        - type
        - category
        - amount
        - merchantCategoryCode
        - settlementPending
        - failed
        - authorisationId
        - shop
        properties:
          type:
            type: string
            const: SubscriptionPayment
          category:
            type: string
            const: ECommerce
          amount:
            $ref: '#/components/schemas/Money'
          merchantCategoryCode:
            $ref: '#/components/schemas/MerchantCategoryCode'
            description: 'The merchant category code of the merchant from which the purchase was made.  See ISO 18245:2023 for more information on available merchant category codes.

              Consumer PSPs can use this information to display a logo or provide contextual information when displaying  the activity to the consumer.'
          settlementPending:
            type: boolean
            description: A transaction is considered pending when it has been authorised but has yet to be settled. `settlementPending` would be `false` if the authorisation has failed, been rejected, or
              if the transaction has already been settled.
          failed:
            type: boolean
            description: Indicates whether the subscription payment failed.
          refundedAmount:
            $ref: '#/components/schemas/Money'
            description: The amount that was refunded for this payment.  This amount can cover a part of the original amount, the full amount, or even more than the original amount.
          authorisationId:
            type: string
            description: The [ID of the authorisation](ref:create-consumer-psp-authorisation) that was given to the consumer PSP when the payment request has been created. Consumer PSPs can use this field
              to link an EPI activity to their SEPA transaction.
          captureId:
            type: string
            description: The ID of the capture, as is returned by EPI central services. Consumer PSPs can use this field to link an EPI activity to their SEPA transaction.
          originatorPspReference:
            $ref: '#/components/schemas/EComOriginatorPspReference'
          shop:
            $ref: '#/components/schemas/Shop'
          _links:
            type: object
            required:
            - self
            properties:
              self:
                $ref: '#/components/schemas/link'
                description: A link to the details of the activity.
    P2PRequestExpiredHistoryItem:
      type: object
      required:
      - type
      - occurredAt
      properties:
        type:
          type: string
          const: Expired
        occurredAt:
          type: string
          format: date-time
          description: The date and time when the request expired.
    RefundActivity:
      allOf:
      - $ref: '#/components/schemas/EComActivity'
      - type: object
        required:
        - type
        - category
        - history
        - refund
        - refundId
        - refundType
        - captureId
        - refundedAmount
        - originAmount
        - originPaymentPlan
        properties:
          history:
            type: array
            description: "The history of the payment-related changes in this activity. \n"
            items:
              $ref: '#/components/schemas/RefundHistoryItem'
          type:
            type: string
            const: Refund
          category:
            type: string
            const: ECommerce
          refundedAmount:
            $ref: '#/components/schemas/Money'
          originAmount:
            $ref: '#/components/schemas/Money'
          originPaymentPlan:
            $ref: '#/components/schemas/PaymentPlan'
          paymentCreatedAt:
            description: 'The date and time when the original payment was created.

              '
            format: date-time
            type: string
          refund:
            type: object
            properties:
              messages:
                type: array
                description: 'Acceptor PSPs can add messages to the consumer during the refund process.

                  '
                items:
                  type: string
          refundId:
            type: string
            format: uuid
            description: 'The ID of the refund in EPI central services. Consumer PSPs can use this field to link an EPI activity to their SEPA transaction. The refund ID can be found either in the remittance
              info (T009, the first UUID) or in the originator''s reference (T014) but without any ''-''.

              '
          refundType:
            type: string
            enum:
            - FullRefund
            - PartialRefund
            - OverRefund
