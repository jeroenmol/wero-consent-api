              '
          captureId:
            type: string
            format: uuid
            description: The UUID of the capture this refund refers to.
          _links:
            type: object
            required:
            - self
            properties:
              self:
                allOf:
                - $ref: '#/components/schemas/link'
                  description: 'A link to this activity.

                    '
              refundedActivity:
                $ref: '#/components/schemas/link'
                description: 'A deep link to the payment activity for which the refund was created.

                  '
    SingleImmediatePaymentPlan:
      title: Single, immediate payment
