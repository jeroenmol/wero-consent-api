          $ref: '#/components/schemas/Money'
          description: "Amounts of money in the API are represented as objects with a single property that describes both the currency (for example, euro) and the unit (which is usually the minor unit of\
            \ the currency, for example, cents).\n\nCurrently, the only supported representation is euroCents, as shown in the example.\n\nOther currencies will be added as needed.\nFor this payment plan\
            \ type, the value in the amount field defines the maximum cumulative amount that can be spent within any rolling 4\u2011week period. The current default is 800.00 EUR. Consequently, the amount\
            \ field must be set to 800.00 EUR when the payment plan is created; otherwise, the request will be rejected. After creation, the consumer can change this limit from their wallet at their discretion."
        amountOfFirstPayment:
