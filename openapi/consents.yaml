          description: "This amount is used to indicate that a consumer\u2011present future payment consent was initiated together with a payment for a specific purchase. To ensure the consumer can see\
            \ the exact purchase amount when they are asked to provide consent, the corresponding amount must be supplied here.\nAmounts of money in the API are represented as objects with a single property\
            \ that describes both the currency (for example, euro) and the unit (which is usually the minor unit of the currency, for example, cents).\n\nCurrently, the only supported representation is\
