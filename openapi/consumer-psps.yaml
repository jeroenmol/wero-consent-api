openapi: 3.0.0
info:
  title: Consumer Psps API
  version: 1.0.0
  description: API specification for consumer-psps resource
servers:
- url: https://api.example.com
paths:
  /api/consumer-psps:
    servers: []
    get:
      deprecated: true
      tags:
      - consumer-psps
      operationId: list-consumer-psps
      parameters:
      - name: filterBy
        in: query
        description: The property key to filter by.
        schema:
          type: string
          enum:
          - name
          - countryCode
      - name: query
        in: query
        schema:
          type: string
        description: Parameter used along side 'filterBy' query parameter. The value of the property specified by `filterBy` to filter by.
      responses:
        '200':
          description: '200'
          content:
            application/hal+json; charset=UTF-8:
              schema:
                type: object
                examples:
                - _links:
                    self:
                      href: https://api.epi-services.eu/api/consumer-psps?filterBy=name&query=ING
                  _embedded:
                    consumerPsps:
                    - id: 00000000-0000-0000-0000-000000009011
                      name: ING BE
                      countryCodeList:
                      - BE
                      appsCount: 1
                      _links:
                        self:
                          href: https://api.epi-services.eu/api/consumer-psps/00000000-0000-0000-0000-000000009011
                      _embedded:
                        meta:
                          icon:
                            contentBase64: 
                            type: image/png
                          textColor: '#000000'
                          primaryColor: '#FFFFFF'
                          secondaryColor: rgb(255, 98, 0)
                    - id: 00000000-0000-0000-0000-000000009012
                      name: ING DE
                      countryCodeList:
                      - DE
                      appsCount: 1
                      _links:
                        self:
                          href: https://api.epi-services.eu/api/consumer-psps/00000000-0000-0000-0000-000000009012
                      _embedded:
                        meta:
                          icon:
                            contentBase64: 
                            type: image/png
                          textColor: '#000000'
                          primaryColor: '#FFFFFF'
                          secondaryColor: '#FFFFFF'
                required:
                - _links
                - _embedded
                properties:
                  _links:
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        $ref: '#/components/schemas/link'
                  _embedded:
                    type: object
                    required:
                    - consumerPsps
                    properties:
                      consumerPsps:
                        type: array
                        items:
                          $ref: '#/components/schemas/consumerPSPListSchema'
              examples:
                list-consumer-psps:
                  value:
                    _links:
                      self:
                        href: https://api.epi-services.eu/api/consumer-psps?filterBy=name&query=ING
                    _embedded:
                      consumerPsps:
                      - id: 00000000-0000-0000-0000-000000009011
                        name: ING BE
                        countryCodeList:
                        - BE
                        appsCount: 1
                        _links:
                          self:
                            href: https://api.epi-services.eu/api/consumer-psps/00000000-0000-0000-0000-000000009011
                        _embedded:
                          meta:
                            icon:
                              contentBase64: 
                              type: image/png
                            textColor: '#000000'
                            primaryColor: '#FFFFFF'
                            secondaryColor: '#FFFFFF'
                      - id: 00000000-0000-0000-0000-000000009012
                        name: ING DE
                        countryCodeList:
                        - DE
                        appsCount: 1
                        _links:
                          self:
                            href: https://api.epi-services.eu/api/consumer-psps/00000000-0000-0000-0000-000000009012
                        _embedded:
                          meta:
                            icon:
                              contentBase64: 
                              type: image/png
                            textColor: '#000000'
                            primaryColor: '#FFFFFF'
                            secondaryColor: '#FFFFFF'
        '400':
          $ref: '#/components/responses/errorResponse400'
      description: "\n## Consumer PSPs\nIn EPI central services, each consumer PSP is represented by a consumer PSP resource.\n\n### List all valid consumer PSPs **\u26A0\uFE0F Advance notice of breaking\
        \ change**. This API will be removed on 2026-07-02. Use [List service providers \\[used by TSPs\\]](ref:get-service-providers) instead.\nThe wallet can retrieve a list of all consumer PSPs so that\
        \ the consumer can select from the list. The wallet can filter the list by querying for a substring of the name property. If the filter is omitted, the full list is returned."
      summary: List valid consumer PSPs [Wallet]
      security:
      - BearerAccessToken: []
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that uniquely identifies the problem type, only in the context of the provided endpoint.
          default: about:blank
          example: /some/uri-reference
          not:
            enum:
            - /problem/constraint-violation
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: some title for the error situation
        status:
          type: integer
          format: int32
          description: The 'status' member is only advisory; it conveys the HTTP status code used for the convenience of the consumer. This attribute is always the same as the status code in the actual
            HTTP response.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem, which helps locate the problem and describes how to proceed.
          example: some description for the error situation
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem, for example, by adding a fragment identifier or sub-path to the problem type. Can be used to locate the root
            of the problem in the source code.
          example: /some/uri-reference#specific-occurrence-context
        callId:
          type: string
          description: A call ID that identifies the specific occurrence of the problem.
          example: 00000000000000000000000000000000-0000000000000000
      required:
      - type
      - title
      - status
    AppIcon:
      type: object
      description: Icon of the registered consumer PSP app. This can either be a mobile or web specific application.
      properties:
        contentBase64:
          type: string
          description: The content of the image as a base64 data string.
          example: 
        type:
          type: string
          description: The type of the image as a media type string, either JPG or PNG.
          example: image/png
      required:
      - contentBase64
      - type
