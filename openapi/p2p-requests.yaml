openapi: 3.0.0
info:
  title: P2P Requests API
  version: 1.0.0
  description: API specification for p2p-requests resource
servers:
- url: https://api.example.com
paths:
  /api/p2p-requests:
    servers: []
    post:
      summary: Create a P2P request [Wallet]
      x-slo:
        availability: 99.95
        latency:
          p95: 300
          p99: 600
          max: 1800
        throughput: N/A
        severity: N/A
        status: DRAFT
      tags:
      - p2p-requests
      responses:
        '201':
          description: Created
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/P2PRequestPayeeSchema'
              examples:
                Example 1:
                  value:
                    id: 0e1acec0-57ed-4094-94db-cdcfee5ae7b6
                    amount:
                      euroCents: 4900
                    title: "\U0001F9F3\U0001F304\U0001F4B6"
                    message: "For our weekend trip \U0001F64F."
                    status:
                      value: Pending
                      at: '2023-05-04T10:39:18.238726038Z'
                    created: '2023-05-03T10:39:18.238726038Z'
                    updatedAt: '2023-05-04T10:39:18.238726038Z'
                    expiresAt: '2023-06-02T10:39:18.238726038Z'
                    payeePaymentMeansId: c28d282a-ac77-4bee-a5c1-bc4d7ed426c3
                    payeePaymentSourceId: 1b3e8663-eef2-4453-8230-7ccc74da2bed
                    payerProxyHash: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
                    closed: false
                    _embedded:
                      payerContact:
                        displayName: Payer Display Name
                        proxyValue: '+431809876543210'
                        pro: false
                        isBlocked: false
                    _links:
                      self:
                        href: https://api.epi-services.eu/api/p2p-requests/0e1acec0-57ed-4094-94db-cdcfee5ae7b6
                      cancellation:
                        href: https://api.epi-services.eu/api/p2p-requests/0e1acec0-57ed-4094-94db-cdcfee5ae7b6/cancellation
                    viewerType: Payee
          headers:
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              schema:
                type: string
                format: uri
              description: URL that points to the location of the new p2p-request resource. For more information about this response header, see [MDN web documentation](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Location).
        '400':
          $ref: '#/components/responses/errorResponse400'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ShareIdNotFound:
                  value:
                    type: /problem/payment-source-profile/share-id/not-found
                    status: 404
                    title: Not Found
                    callId: 00000000000000000000000000000000-0000000000000000
        '422':
          $ref: '#/components/responses/UnprocessableContentForRequestCreation'
        '429':
          $ref: '#/components/responses/errorResponse429'
      operationId: post-p2p-requests
      parameters:
      - $ref: '#/components/parameters/Idempotency-Key'
      description: "## Person-to-person requests\nOne consumer (the payee) can request money from another consumer (the payer) through a person-to-person (P2P) request.\n\nThe payee creates a P2P request,\
        \ including details like the amount, the payer and a message. In the standalone Wero digital wallet app, the payer approves the P2P request, which creates a P2P payment. This P2P payment follows\
        \ the same flow as if it were created by the payer without a request from the payee.\n\n### Create a P2P request\nWith the following API request, the payee can create the P2P request. The payer\
        \ is notified about the P2P request.\nCurrently, P2P payments are limited to 10,000,000 euro cents (\u20AC100,000).\nIn addition, a payee currently has a limit of creating 100 P2P requests per week.\n\
        This request can benefit from clients setting the Idempotency-Key header. For more information, see [Idempotency](ref:idempotency).\nThe `p2p:transferMoney` scope is required to access this route.\n\
        ### Payer identification\nThe request payer is identified by either `payerProxyHash` or `payerShareId`. This is done during the creation of the P2P request.\nThe criteria that is used to initially\
        \ identify the payer is not updated during the lifetime of the request, even if the payer proxy is removed or reassigned to another consumer: the request still points to the consumer that is initially\
        \ linked to the proxy.\nFor instance:\n  - Consumer A creates a P2P request with `payerProxyHash` pointing to Consumer B.\n  - Consumer B removes the proxy.\n  - Consumer C is assigned the proxy.\n\
        \  - Consumer A's P2P request still points to Consumer B."
      security:
      - BearerAccessToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              examples:
              - title: "\U0001F9F3\U0001F304\U0001F4B6"
                message: "For our weekend trip \U0001F64F."
                amount:
                  euroCents: 4900
                payeePaymentMeansId: c28d282a-ac77-4bee-a5c1-bc4d7ed426c3
                payerProxyHash: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
              properties:
                title:
                  type: string
                  description: Large message title sent to the payer. Limited to 3 graphemes.
                  example: "\U0001F382\U0001F37D\uFE0F\U0001F4B6"
                message:
                  type: string
                  description: Message that is sent to the payer. Limited to 250 graphemes.
                paymentReference:
                  $ref: '#/components/schemas/PaymentReference'
                amount:
                  allOf:
                  - $ref: '#/components/schemas/Money'
                  - type: object
                    properties:
                      euroCents:
                        type: integer
                        minimum: 1
                        maximum: 10000000
                payeePaymentMeansId:
                  type: string
                  description: The means of payment that is used to receive the payment.
                payerProxyHash:
                  $ref: '#/components/schemas/proxyHash'
                payerShareId:
                  type: string
                  description: The share ID of the payer's payment source.
                consumerDeviceTelemetry:
                  $ref: '#/components/schemas/InboundConsumerDeviceTelemetry'
              oneOf:
              - required:
                - amount
                - payeePaymentMeansId
                - payerProxyHash
                title: CreateRequestViaProxyHash
              - required:
                - amount
                - payeePaymentMeansId
                - payerShareId
                title: CreateRequestViaShareId
            examples:
              p2p-request-with-consumer-device-telemetry:
                value:
                  title: "\U0001F9F3\U0001F304\U0001F4B6"
                  message: "For our weekend trip \U0001F64F."
                  amount:
                    euroCents: 4900
                  payeePaymentMeansId: c28d282a-ac77-4bee-a5c1-bc4d7ed426c3
                  payerProxyHash: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
                  consumerDeviceTelemetry:
                    deviceUserAgent: Mozilla/5.0 (iPhone; CPU iPhone OS 13_3 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.5 Mobile/15E148 Safari/604.1
                    deviceIpAddress: 192.0.2.123
                    deviceId: 6fc1c567-a4cd-45c5-9e44-c5a5b9a6f09a
                    deviceModel: iPhone11
                    deviceScreenResolution: 828x1792
                    deviceLanguage: en_US
                    deviceLocation: 37.7749,-122.4194
                    deviceCellularProvider: Vodafone, Telekom
                    deviceOperatingSystem: iOS
                    deviceTimeZone: Europe/Berlin
                    deviceTime: '2020-01-01T12:00:00.000Z'
                    additionalPropertyExample: some value
        description: ''
    get:
      summary: List P2P requests [Wallet]
      x-slo:
        availability: 99.95
        latency:
          p95: 250
          p99: 400
          max: 1200
        throughput: N/A
        severity: N/A
        status: DRAFT
      tags:
      - p2p-requests
      parameters:
      - name: page
        in: query
        description: The requested page number.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: The requested page size. The data is split into pages of this size, and the numbering depends on this page size.
        required: false
        schema:
          type: integer
          minimum: 10
          maximum: 100
          default: 10
      - name: sort
        in: query
        description: The sorting order. Sort either by creation date `created:(asc|desc)`, updated date `updatedAt:(asc|desc)` or by status `status:(asc|desc)` .
        required: false
        schema:
          type: string
          default: created:desc
        example: created:desc,status:asc
      - name: status
        in: query
        description: Filter by the status of the P2P request.
        required: false
        schema:
          type: string
        examples:
          singleValue:
            value: Accepted
            summary: A single valid value
          allValues:
            $ref: '#/components/examples/allRequestStatuses'
      - name: closed
        in: query
        description: Filter only closed (`closed=true`) or unresolved (`closed=false`) P2P requests. Closed P2P requests refer to P2P requests in status `Canceled`, `Rejected`, `Expired` or `Approved` with
          a payment settled or `Approved` that have automatically been closed after 7 days. Unresolved P2P requests refer to P2P requests in status `Pending` or `Approved` but with no settled P2P payment.
        required: false
        schema:
          type: boolean
      - name: direction
        in: query
        description: Filter by whether the P2P request was sent or received.
        required: false
        schema:
          type: string
          enum:
          - Received
          - Sent
      - name: payerPaymentSourceId
        in: query
        description: Filter by the payment source ID of the payer.
        required: false
        schema:
          type: string
          format: uuid
      - name: payeePaymentMeansId
        in: query
        description: Filter by the payment means ID of the payee.
        required: false
        schema:
          type: string
          format: uuid
      - name: payerProxyHash
        in: query
        description: Filter by the proxy hash of the payer.
        required: false
        schema:
          $ref: '#/components/schemas/proxyHash'
      - name: updatedSince
        in: query
        description: Filter by the `updatedAt` value. This excludes any payments that occur before the specified timestamp.
        required: false
        schema:
          type: string
          format: date-time
          example: '2023-05-03T10:39:16.425084691Z'
      responses:
        '200':
          description: OK
          content:
            application/hal+json; charset=UTF-8:
              schema:
                type: object
                examples:
                - _links:
                    self:
                      href: https://api.epi-services.eu/api/p2p-requests?page=0&size=10&sort=created%3Adesc
                    first:
                      href: https://api.epi-services.eu/api/p2p-requests?page=0&size=10&sort=created%3Adesc
                    last:
                      href: https://api.epi-services.eu/api/p2p-requests?page=0&size=10&sort=created%3Adesc
                  _embedded:
                    p2pRequests:
                    - id: 03cfdaa2-8d64-410f-918b-447527d02299
                      amount:
                        euroCents: 1399
                      title: "\U0001F355\U0001F355\U0001F60A"
                      message: "Please pay me for the pizza \U0001F355."
                      status:
                        value: Pending
                        at: '2023-05-03T10:39:18.474001237Z'
                      created: '2023-05-03T10:39:18.474001237Z'
                      updatedAt: '2023-05-04T10:39:18.474001237Z'
                      expiresAt: '2023-06-02T10:39:18.474001237Z'
                      payeePaymentMeansId: c28d282a-ac77-4bee-a5c1-bc4d7ed426c3
                      payeePaymentSourceId: 1b3e8663-eef2-4453-8230-7ccc74da2bed
                      payerProxyHash: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
                      closed: false
                      _embedded:
                        payerContact:
                          displayName: Payer Display Name
                          proxyValue: '+431809876543210'
                          pro: false
                          isBlocked: true
                      _links:
                        self:
                          href: https://api.epi-services.eu/api/p2p-requests/03cfdaa2-8d64-410f-918b-447527d02299
                        cancellation:
                          href: https://api.epi-services.eu/api/p2p-requests/03cfdaa2-8d64-410f-918b-447527d02299/cancellation
                      viewerType: Payee
                  page:
                    size: 1
                    totalElements: 1
                    totalPages: 1
                    number: 0
                    requestedPageSize: 10
                    limitReached: false
                properties:
                  _embedded:
                    type: object
                    properties:
                      p2pRequests:
                        type: array
                        items:
                          $ref: '#/components/schemas/P2PRequestWalletSchema'
                  _links:
                    $ref: '#/components/schemas/PagedCollectionResourceLinks'
                  page:
                    $ref: '#/components/schemas/page'
                required:
                - _embedded
                - _links
                - page
              examples:
                Example 1:
                  value:
                    _links:
                      self:
                        href: https://api.epi-services.eu/api/p2p-requests?page=0&size=10&sort=created%3Adesc
                      first:
                        href: https://api.epi-services.eu/api/p2p-requests?page=0&size=10&sort=created%3Adesc
                      last:
                        href: https://api.epi-services.eu/api/p2p-requests?page=0&size=10&sort=created%3Adesc
                    _embedded:
                      p2pRequests:
                      - id: 03cfdaa2-8d64-410f-918b-447527d02299
                        amount:
                          euroCents: 1399
                        title: "\U0001F355\U0001F355\U0001F60A"
                        message: "Please pay me for the pizza \U0001F355."
                        status:
                          value: Pending
                          at: '2023-05-04T10:39:18.474001237Z'
                        created: '2023-05-03T10:39:18.474001237Z'
                        updatedAt: '2023-05-04T10:39:18.474001237Z'
                        expiresAt: '2023-06-02T10:39:18.474001237Z'
                        payeePaymentMeansId: c28d282a-ac77-4bee-a5c1-bc4d7ed426c3
                        payeePaymentSourceId: 1b3e8663-eef2-4453-8230-7ccc74da2bed
                        payerProxyHash: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
                        closed: false
                        _embedded:
                          payerContact:
                            displayName: Payer Display Name
                            proxyValue: '+431809876543210'
                            pro: false
                            isBlocked: false
                        _links:
                          self:
                            href: https://api.epi-services.eu/api/p2p-requests/03cfdaa2-8d64-410f-918b-447527d02299
                          cancellation:
                            href: https://api.epi-services.eu/api/p2p-requests/03cfdaa2-8d64-410f-918b-447527d02299/cancellation
                        viewerType: Payee
                    page:
                      size: 1
                      totalElements: 1
                      totalPages: 1
                      number: 0
                      requestedPageSize: 10
                      limitReached: false
        '400':
          $ref: '#/components/responses/errorResponse400'
        '404':
          $ref: '#/components/responses/errorResponse404'
      operationId: get-p2p-requests
      security:
      - BearerAccessToken: []
      description: 'Consumers can retrieve all P2P requests that they have made or received.



        The list is paginated. Retrieving the full list might require multiple API calls

        when `page.totalPages` is greater than 1. For more information, see [Pagination](ref:pagination).



        Note that the `p2pPayment` embedded object is always returned for the payer but only when the payment is settled for the payee.'
components:
  schemas:
    MtPaymentOrigin:
      description: The payment origin describes the origin of the payment and whether it is coming from a payee-based request or not (Direct).
      oneOf:
      - $ref: '#/components/schemas/P2PPaymentOriginRequest'
      - $ref: '#/components/schemas/P2PPaymentOriginOpenRequest'
      - $ref: '#/components/schemas/P2PPaymentOriginShareId'
      - $ref: '#/components/schemas/P2PPaymentOriginDirect'
      discriminator:
        propertyName: type
        mapping:
          P2PRequest: '#/components/schemas/P2PPaymentOriginRequest'
          P2POpenRequest: '#/components/schemas/P2PPaymentOriginOpenRequest'
          ShareId: '#/components/schemas/P2PPaymentOriginShareId'
          Direct: '#/components/schemas/P2PPaymentOriginDirect'
    MtPartyName:
      title: The party name.
      description: 'The name of the respective party (originator, beneficiary) of the payment (P001, E001). In case of a payee, the display name follows VoP rules: either the account holder name or the
        KYC consumer name, obfuscated or not.'
      type: string
      minLength: 1
      maxLength: 70
    P2PPaymentOriginDirect:
      type: object
      description: A _direct_ P2P payment does not originate from any kind of request.
      properties:
        type:
          description: This property is a discriminator; its value is always `Direct`. A _direct_ P2P payment does not originate from any kind of request.
          const: Direct
      required:
      - type
    paymentRuleResourceItem:
      oneOf:
      - $ref: '#/components/schemas/paymentRuleResourceItemFixed'
      - $ref: '#/components/schemas/paymentRuleResourceItemCyclic'
      - $ref: '#/components/schemas/paymentRuleResourceItemSliding'
      discriminator:
        propertyName: type
        mapping:
          Fixed: '#/components/schemas/paymentRuleResourceItemFixed'
          Cyclic: '#/components/schemas/paymentRuleResourceItemCyclic'
          Sliding: '#/components/schemas/paymentRuleResourceItemSliding'
    P2PRequestPayerSchema:
      title: P2P Request [Wallet] (received as payer)
      type: object
      description: This is a P2P request as seen by the payer.
      properties:
        id:
          type: string
          description: ID of the P2P request.
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        title:
          type: string
          description: Large text used as message title, limited to 3 characters, sent to the payer.
          example: "\U0001F382\U0001F37D\uFE0F\U0001F4B6"
        message:
          type: string
          description: Message that is sent to the payer.
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        status:
          type: object
          description: Status of the P2P request.
          properties:
            value:
              $ref: '#/components/schemas/P2PRequestStatus'
            at:
              type: string
              format: date-time
              description: 'Date and time at which the status was last updated. (Format: Timestamp)'
          required:
          - value
          - at
        closed:
          type: boolean
          description: Indicates whether the P2P request is closed, meaning that it can no longer be paid.
        closesAt:
          type: string
          format: date-time
          description: Date and time at which the P2P request will be automatically closed, unless it is closed earlier. This applies only if the P2P request has been approved but no associated payment
            has been settled yet. This date is set to 7 days after the P2P request is approved.
        created:
          type: string
          format: date-time
          description: 'Date and time at which the P2P request was created. (Format: Timestamp)'
        expiresAt:
          type: string
          format: date-time
          description: 'Date and time at which the P2P request expires. (Format: Timestamp)'
        updatedAt:
          type: string
          format: date-time
          description: 'Date and time at which the P2P request was updated. (Format: Timestamp)'
        availableAction:
          type: string
          description: The action available to the payer.
          oneOf:
          - const: ApproveRequest
            default: ApproveRequest
            title: ApproveRequest
            description: Payer can approve the P2P request.
            type: string
          - const: ApprovePayment
            default: ApprovePayment
            title: ApprovePayment
            description: The payer can approve the P2P payment (standard flow), or the consumer PSP can settle it (alternative flow).
            type: string
          - const: Wait
            default: Wait
            title: Wait
            description: Payer must wait for the consumer PSP to settle the P2P payment.
            type: string
          - const: CreateNewPayment
            default: CreateNewPayment
            title: CreateNewPayment
            description: Payer can retry a new P2P payment.
            type: string
          - type: string
            not:
              enum:
              - ApproveRequest
              - ApprovePayment
              - Wait
              - CreateNewPayment
            description: Placeholder for a future action, to be defined. This cannot be used for custom actions.
            title: Any String
        _embedded:
          type: object
          description: Embedded, related resources.
          properties:
            payeeContact:
              $ref: '#/components/schemas/ConsumerProfile'
            p2pPayment:
              $ref: '#/components/schemas/P2PPaymentPayerSchema'
        _links:
          type: object
          description: HAL links to related resources.
          required:
          - self
          - approval
          - rejection
          - blockContact
          properties:
            self:
              $ref: '#/components/schemas/link'
            approval:
              $ref: '#/components/schemas/link'
            rejection:
              $ref: '#/components/schemas/link'
            blockContact:
              $ref: '#/components/schemas/link'
            retryPayment:
              $ref: '#/components/schemas/link'
        viewerType:
          type: string
          description: The type of the viewer of the P2P request.
          const: Payer
          enum:
          - Payer
      required:
      - id
      - amount
      - status
      - closed
      - created
      - expiresAt
      - updatedAt
      - _embedded
      - _links
      - viewerType
    P2PPaymentOriginShareId:
      type: object
      description: A share ID QR code (static QR code that does not expire) can result in either a P2P payment from the consumer scanning it or a P2P Request towards the consumer who shared their QR code,
        leading to a P2P payment on approval.
      properties:
        type:
          description: This property is a discriminator; its value is always `ShareId`. A share ID QR code (static QR code that does not expire) can result in either a P2P payment from the consumer scanning
            it or a P2P Request towards the consumer who shared their QR code, leading to a P2P payment on approval.
          const: ShareId
        shareId:
          type: string
          minLength: 1
          description: The share ID value (part of the QR code share URL).
      required:
      - type
      - shareId
    PagedCollectionResourceLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/link'
        first:
          $ref: '#/components/schemas/link'
        last:
          $ref: '#/components/schemas/link'
        prev:
          $ref: '#/components/schemas/link'
        next:
          $ref: '#/components/schemas/link'
      required:
      - self
      - first
      - last
    P2PPaymentPayerLinks:
      type: object
      description: HAL links to related resources.
      required:
      - self
      properties:
        self:
          $ref: '#/components/schemas/link'
        approval:
          $ref: '#/components/schemas/link'
        cancellation:
          $ref: '#/components/schemas/link'
        fraudRiskInformation:
          description: Is returned only when a consumer PSP makes the request.
          $ref: '#/components/schemas/link'
    MtCategoryPurpose:
      title: Category purpose of the EPI payment.
      description: The category purpose of the EPI payment (T008). The value is always set to EPI.
      type: string
      oneOf:
      - type: string
        const: EPI
        default: EPI
        title: EPI
        enum:
        - EPI
      - type: string
        minLength: 0
        maxLength: 35
        not:
          enum:
          - EPI
        title: Any string
    MtRemittanceInfo:
      title: Remittance information.
      description: The remittance information (T009) that must be sent for the SCT inst. This information is the message that the payer wrote for the payee during the send-money procedure in the standalone
        Wero digital wallet or mobile banking app. If the payer adds a message, it is mandatory to send the remittance information. However, if the consumer adds no message, sending an empty string or omitting
        the empty `remittanceinfo` element is acceptable. Different rules apply for local-market and cross-border transactions. For more information, see [Settlement triggering - data requirements](doc:settlement-triggering#212-data-requirements).
      type: string
      maxLength: 140
    proxyHash:
      title: proxyHash
      type: string
      pattern: ^[a-zA-Z0-9\-_=]{44}$
      minLength: 44
      maxLength: 44
      example: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
      description: Hashed proxy of a payee or payer.
    P2PRequestPayeeSchema:
      title: P2P Request [Wallet] (created as payee)
      type: object
      description: This is a P2P request. It is created by the payee and can be approved or rejected by payers.
      properties:
        id:
          type: string
          description: ID of the P2P request.
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        title:
          type: string
          description: Large text used as message title, limited to 3 characters, sent to the payer.
          example: "\U0001F382\U0001F37D\uFE0F\U0001F4B6"
        message:
          type: string
          description: Message that is sent to the payer.
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        status:
          type: object
          description: Status of the P2P request.
          properties:
            value:
              $ref: '#/components/schemas/P2PRequestStatus'
            at:
              type: string
              format: date-time
              description: 'Date and time at which the status was last updated. (Format: Timestamp)'
          required:
          - value
          - at
        created:
          type: string
          format: date-time
          description: 'Date and time at which the P2P request was created. (Format: Timestamp)'
        expiresAt:
          type: string
          format: date-time
          description: 'Date and time at which the P2P request expires. (Format: Timestamp)'
        updatedAt:
          type: string
          format: date-time
          description: 'Date and time at which the P2P request was updated. (Format: Timestamp)'
        payeePaymentMeansId:
          type: string
          format: uuid
          description: The means of payment that is used to receive the payment.
        payeePaymentSourceId:
          type: string
          format: uuid
          description: The payment source ID of the payee.
        payerProxyHash:
          $ref: '#/components/schemas/proxyHash'
        payerShareId:
          type: string
          description: The share ID of the payer that is only set if `payerProxyHash` is `null`.
        closed:
          type: boolean
          description: Indicates whether the P2P request is closed, meaning that it can no longer be paid.
        closesAt:
          type: string
          format: date-time
          description: Date and time at which the P2P request will be automatically closed, unless it is closed earlier. This applies only if the P2P request has been approved but no associated payment
            has been settled yet. This date is set to 7 days after the P2P request is approved.
        _embedded:
          type: object
          description: Embedded, related resources.
          properties:
            payerContact:
              $ref: '#/components/schemas/ConsumerProfile'
              description: 'The profile of the payer that is displayed to the payee.

                The profile information is derived from the proxy hash of the payer at the time of the payment request creation. This profile information might be different from the related P2P-payment
                payer information because on approval, the payer can use a different payment means.'
            p2pPayment:
              $ref: '#/components/schemas/P2PPaymentPayeeSchema'
        _links:
          type: object
          description: HAL links to related resources.
          required:
          - self
          - cancellation
          properties:
            self:
              $ref: '#/components/schemas/link'
            cancellation:
              $ref: '#/components/schemas/link'
        viewerType:
          type: string
          description: The type of the viewer of the P2P request.
          const: Payee
          enum:
          - Payee
      required:
      - id
      - amount
      - status
      - created
      - expiresAt
      - updatedAt
      - payeePaymentMeansId
      - payeePaymentSourceId
      - closed
      - _embedded
      - _links
      - viewerType
      examples:
      - id: 0e1acec0-57ed-4094-94db-cdcfee5ae7b6
        amount:
          euroCents: 4900
        message: "For our weekend trip \U0001F9F3 \U0001F304."
        status:
          value: Pending
          at: '2023-05-04T10:39:18.238726038Z'
        created: '2023-05-03T10:39:18.238726038Z'
        updatedAt: '2023-05-04T10:39:18.238726038Z'
        expiresAt: '2023-06-02T10:39:18.238726038Z'
        payeePaymentMeansId: c28d282a-ac77-4bee-a5c1-bc4d7ed426c3
        payeePaymentSourceId: 1b3e8663-eef2-4453-8230-7ccc74da2bed
        payerProxyHash: PZGI4MTD8kVdbysQMF8ztCykGY87PLIhrg-1qfxPPrg=
        closed: false
        _embedded:
          payerContact:
            displayName: Payer Display Name
            proxyValue: '+431809876543210'
            pro: false
        _links:
          self:
            href: https://api.epi-services.eu/api/p2p-requests/0e1acec0-57ed-4094-94db-cdcfee5ae7b6
          cancellation:
            href: https://api.epi-services.eu/api/p2p-requests/0e1acec0-57ed-4094-94db-cdcfee5ae7b6/cancellation
        viewerType: Payee
    Money:
      title: Money
      type: object
      properties:
        euroCents:
          type: integer
          description: 'The minimum `euroCents` value is `1`. `euroCents: 100` represents one euro.'
      description: 'Amounts of money in the API are represented as objects with a single property that describes both the currency (for example, euro) and the unit (which is usually the minor unit of the
        currency, for example, cents).


        Currently, the only supported representation is euroCents, as shown in the example.


        Other currencies will be added as needed.'
      examples:
      - euroCents: 4900
    P2PPaymentOriginOpenRequest:
      type: object
      description: A payment that originates from a P2P open request (stateful QR code / share via link).
      properties:
        type:
          description: This property is a discriminator; its value is always `P2POpenRequest`. A payment that originates from a P2P open request (stateful QR code / share via link).
          const: P2POpenRequest
        id:
          type: string
          format: uuid
          description: The ID of the P2P open request.
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        viewsCount:
          type: integer
          minimum: 0
          description: The number of views the link / QR code has received (total number of calls to the [Decode share URL](ref:post-api-share-url-decode) route).
          examples:
          - 5
        linkedP2PPaymentIds:
          type: array
          items:
            type: string
          description: The IDs of all P2P payments originating from this P2P open request.
          examples:
          - - 123e4567-e89b-12d3-a456-426614174000
            - 345e6789-e12b-34c5-d678-987654321000
        settledP2PPaymentIds:
          type: array
          items:
            type: string
          description: The IDs of the P2P payments associated to this open request that have been settled.
          examples:
          - - 123e4567-e89b-12d3-a456-426614174000
            - 987e6543-e21b-34c5-d678-987654321000
        expiryDuration:
          type: integer
          minimum: 0
          description: The duration in seconds after which the P2P payment request was configured to expire. A shorter duration may indicate QR code usage rather than a shared link.
          examples:
          - 3600
        totalExpectedPayments:
          type: integer
          minimum: 0
          description: The total number of payments expected to be made against this open request. If this value is not provided, the open request can be paid an unlimited number of times until it expires.
            If this number is reached, the open request cannot be paid any more.
          examples:
          - 1
      required:
      - type
      - id
      - viewsCount
      - linkedP2PPaymentIds
      - settledP2PPaymentIds
      - expiryDuration
    MoneyTransferDatasetResource:
      title: Schema of a money transfer request for a P2P(ro) payment.
      type: object
      required:
      - originatorAccountIdentifier
