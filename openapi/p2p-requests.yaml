        \                                                               |\n|:----------:|:-----------------------------------------------------------------------------------------------------------------------------------------------------------:|\n\
        | `Initial`  | The initial status. The payer has not yet approved the P2P payment.                                                                                         |\n| `Canceled` | The payer\
        \ has canceled the P2P payment.                                                                                                                     |\n| `Approved` | The payer has approved the P2P\
        \ payment.                                                                                                                     |\n| `Accepted` | The payer's PSP has accepted the order to settle\
        \ the P2P payment.                                                                                           |\n| `Rejected` | The payer's PSP has rejected the order to settle the P2P payment. \
        \                                                                                          |\n| `Settled`  | The money has been transferred and has reached the beneficiary\u2019s account.      \
        \                                                                             |\n| `Failed`   | The payer's PSP attempted to settle the payment, but the settlement failed. Note that the status is\
        \ `Failed` even if the _payee's_ PSP rejected the payment.|\n| `Expired`  | EPI has expired the payment because the payer didn\u2019t approve it within the required timeframe.                  \
        \                                            |"
    ConsentPayloadResource:
      type: object
      properties:
        payload:
          type: string
          description: The consent payload in JSON format.
        createdAt:
          type: string
          format: date-time
          description: The date and time when the consent payload was generated.
        expiresAt:
          type: string
          format: date-time
          description: The date and time when the consent payload expires.
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  description: The URL of the consent payload resource.
              required:
              - href
          required:
          - self
      required:
      - payload
      - createdAt
      - expiresAt
      - _links
    P2PRequestWalletSchema:
      oneOf:
      - $ref: '#/components/schemas/P2PRequestPayerSchema'
      - $ref: '#/components/schemas/P2PRequestPayeeSchema'
      discriminator:
        propertyName: viewerType
        mapping:
          Payee: '#/components/schemas/P2PRequestPayeeSchema'
          Payer: '#/components/schemas/P2PRequestPayerSchema'
    paymentRuleResourceItemCyclic:
      type: object
      properties:
        type:
          type: string
          description: 'Type of the payment rules: fixed, cyclic or sliding.'
          enum:
          - Cyclic
        constraint:
          $ref: '#/components/schemas/paymentRuleResourceItemConstraint'
        startOffset:
          type: string
          description: An offset (compliant with ISO 8601) that defines the start time of the window during which payment can be collected.   The start time is then the offset amount of time _after_ the
            time that the consumer gave consent.
          example: PT-5S
        windowDuration:
          type: string
          description: Duration (compliant with ISO 8601) of the window during which payment can be collected. Begins at the start time defined by `startOffset`.
          example: PT5M
        modifications:
          type: array
          items:
            type: object
            description: A modification of a cyclic payment window that replaces one or more cycle definitions.   Enables subscriptions to be modelled that, for example, start with a free or discounted
              trial period.
            properties:
              cycleIndexes:
                type: string
                description: The index of the cycle that is modified or replaced.
                pattern: '[0-9]+[.]{2}[0-9]+'
                example: 2..10
              constraint:
                $ref: '#/components/schemas/paymentRuleResourceItemConstraint'
        repetition:
          type: string
          enum:
          - Weekly
          - Monthly
          - Quarterly
          - HalfYearly
          - Yearly
      required:
      - type
      - constraint
      - startOffset
      - windowDuration
      - modifications
      - repetition
    IbanIdentifier:
      title: IBAN account identifier
      type: object
      required:
      - type
      - iban
      description: An IBAN, if the consumer PSP permits EPI to store IBANs. This IBAN must have a valid checksum and a country code from a supported country. For more information, see the [IBAN checker](https://www.iban.com/iban-checker)
        on the IBAN validation and calculation website.
      properties:
        type:
          type: string
          enum:
          - IBAN
        iban:
          $ref: '#/components/schemas/IBAN'
    link:
      type: object
      properties:
        href:
          type: string
          format: uri
        name:
          type: string
      required:
      - href
    paymentRuleResourceItemConstraint:
      type: object
      description: 'Type of the payment constraint: Single or Multiple.'
      properties:
        type:
          type: string
          enum:
          - Single
          - Multiple
          description: Specifies whether the consent is for a single capture or for multiple captures. In the case of multiple captures, the sum of all captures must not exceed the maxAmount.
        maxAmount:
          $ref: '#/components/schemas/Money'
      required:
      - type
      - maxAmount
    MtOriginatorReference:
      title: Originator reference.
      description: 'The originator reference identifies each SCT Inst Instruction presented to the originator PSP for an originator in a unique way. This number will be transmitted in the entire process
        of the handling of the SCT Inst Transaction from acceptance until the transaction completes. Any provider involved in the transaction must return the originator reference in any exception-handling
        process-step. The originator cannot request for any other referencing information to be returned to them to identify an SCT Inst.


        The originator must define the internal structure of this reference; it can only be expected to be meaningful to the originator.


        The originator PSP must include this value as the ''originator''s reference (T014)'' attribute in the SCT Inst. EPI central services create this reference on behalf of the originator. Currently,
        references are created by removing the four hyphens from the `moneyTransferId`. However, the format is subject to change.


        If any party contacts EPI central services for SCT Inst exception handling, that party must provide the originator''s reference. With the current format, EPI central services will re-insert the
        hyphens to obtain the `moneyTransferId` to investigate the exception.'
      type: string
      minLength: 1
      maxLength: 35
    IBAN:
      type: string
    InboundConsumerDeviceTelemetry:
      type: object
      title: Consumer device telemetry
      description: 'Telemetry data ("device fingerprint") of the device used by the consumer.


        EPI cannot guarantee consumer PSPs will send a complete set of consumer device telemetry properties, and therefore they are treated as optional.


        It is possible to send additional properties in this object, which EPI will pass on verbatim to EPI''s fraud scoring service provider for evaluation.


        This is to allow for easier integration on the consumer PSP side.


        However, PSPs are strongly encouraged to provide values for the properties as specified here where possible in order for EPI to provide the best possible fraud scoring.'
      additionalProperties: true
      properties:
        deviceIpAddress:
          description: The IPv4 or IPv6 address of the consumer's device.
          type: string
          example: 192.0.2.123
        devicePort:
          description: The ephemeral port of the consumer's device.
          type: integer
          example: 52314
        deviceUserAgent:
          description: The user agent string of the device used by the consumer. This will often contain information redundantly captured in the `deviceOs` and `deviceModel` properties.
          type: string
          maxLength: 256
          examples:
          - Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 ...
          - Mozilla/5.0 (Linux; Android 10; Pixel 3) AppleWebKit/537.36...
        deviceModel:
          description: The model of the device used by the consumer.
          type: string
          maxLength: 256
          examples:
          - iPhone12,1
          - Pixel 3
        deviceScreenResolution:
          description: The screen resolution of the device used by the consumer, in pixels (width x height).
          type: string
          examples:
          - 828x1792
          - 1080x2280
        deviceCellularProviders:
          type: string
          maxLength: 256
          description: The cellular provider(s) of the device used by the consumer. This is a comma-separated list of the names of the cellular providers.
          examples:
          - Telekom, Vodafone
          - T-Mobile
        deviceLocation:
          description: The location of the device used by the consumer. This is a comma-separated list of the latitude and longitude of the device.
          type: string
          example: 37.7749,-122.4194
        deviceTimeZone:
          description: The time zone of the device used by the consumer.
          type: string
          maxLength: 256
          example: America/Los_Angeles
        deviceId:
          description: 'The unique device identifier of the device used by the consumer. Note: Formats differ (UUID on iOS vs. 64-bit hex string on Android).'
          type: string
          maxLength: 256
          examples:
          - 6fc1c567-a4cd-45c5-9e44-c5a5b9a6f09a
          - 2b6f0cc904d137be2e1730235f5664094b831186
        deviceOs:
          description: The operating system of the device used by the consumer.
          type: string
          examples:
          - iOS
          - Android
        deviceLanguage:
          description: The language of the device used by the consumer.
          type: string
          example: en_US
        deviceTime:
          description: The time on the device used by the consumer, in ISO 8601 format.
          type: string
          format: date-time
          example: '2023-09-25T12:34:56Z'
    ConsumerProfile:
      title: ConsumerProfile
      type: object
      properties:
        displayName:
          type: string
          description: 'The consumer''s name. Depending on the consumer''s personal choice, the consumer name is either the full name as provided by the consumer PSP or an obfuscated name in the form of
            a pseudonym or masked name. In case of a payee, the display name follows VoP rules: either the account holder name or the KYC consumer name, obfuscated or not.'
        proxyValue:
          type: string
          description: Proxy value linked to that consumer.
        pro:
          type: boolean
          description: Indicates whether the payment source linked to the consumer is a business account (P2Pro).
        isBlocked:
          type: boolean
          description: Indicates whether the consumer has been blocked by their counterpart.
      required:
      - displayName
      - pro
    AccountIdentifier:
      description: 'A polymorphic type that identifies an account. The value can be of one of the following types.

        - An IBAN, if the consumer PSP permits EPI to store IBANs. This IBAN must have a valid checksum and a country code from a supported country. For more information, see the [IBAN checker](https://www.iban.com/iban-checker)
        on the IBAN validation and calculation website.

        - An alias for the IBAN, if the consumer PSP does not permit EPI to store IBANs.

        '
      type: object
      oneOf:
      - $ref: '#/components/schemas/IbanIdentifier'
      - $ref: '#/components/schemas/AliasIdentifier'
      discriminator:
        propertyName: type
        mapping:
          IBAN: '#/components/schemas/IbanIdentifier'
          Alias: '#/components/schemas/AliasIdentifier'
    PaymentReference:
      title: Payment Reference
      type: string
      description: 'The reference that is used for the payment. Limited to 140 SEPA characters.

        This will be used within the remittance information of the payment.

        Set this field only in a P2Pro transaction context.'
      pattern: '[-a-zA-Z0-9/?:().,''+\s]*'
      maxLength: 140
    P2PPaymentPayeeSchema:
      title: P2P Payment [Wallet] (as a payee)
      type: object
      description: This is a P2P payment as seen by the payee wallet.
      properties:
        id:
          type: string
          description: ID of the P2P payment. The [create a money transfer](ref:put-money-transfers) endpoint uses this ID as the `moneyTransferId`.
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        title:
          type: string
          description: Large text or emojis used as message title, limited to three characters.
          example: "\U0001F382\U0001F37D\uFE0F\U0001F4B6"
        message:
          type: string
          description: 'Message that is sent to the payee. *Important notice*: This field is going to be marked as optional in the first release of December 2024 to match the optionality of this field in
            the request body, when creating a P2P payment.'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        payeePaymentSourceId:
          type: string
          description: ID of the payment source that received the payment.
          format: uuid
        created:
          type: string
          format: date-time
          description: 'Date and time at which the P2P payment was created. (Format: Timestamp)'
          example: '2023-05-03T10:39:16.425084691Z'
        updatedAt:
          type: string
          format: date-time
          description: 'Date and time at which the P2P payment was updated. (Format: Timestamp)'
          example: '2023-05-03T10:39:16.425084691Z'
        status:
          $ref: '#/components/schemas/p2pPaymentStatus'
        _embedded:
          type: object
          description: Embedded, related resources.
          required:
          - paymentRules
          properties:
            paymentRules:
              type: object
              title: Payment rules
              description: The payment plan is converted into payment rules, which are a parameterised version of the payment plan details. The payment plan is more readable than the payment rules. The
                payment rules describe one or more payments that consumers consent to.
              properties:
                paymentRules:
                  type: array
                  items:
                    $ref: '#/components/schemas/paymentRuleResourceItem'
              required:
              - paymentRules
            paymentDataset:
              $ref: '#/components/schemas/MoneyTransferDatasetResource'
              description: Embedded transaction resource that contains the information for completing the SCT Inst template. Retrievable by the consumer PSP, not the wallet.
            payeeContact:
              $ref: '#/components/schemas/ConsumerProfile'
            payerContact:
              $ref: '#/components/schemas/ConsumerProfile'
            p2pRequest:
              type: object
              description: 'Embedded P2P Request resource if the payment was created from a P2P request. '
            p2pOpenRequest:
              type: object
              description: Embedded P2P open request resource if the payment was created from a P2P open request.
        _links:
          type: object
          description: HAL links to related resources.
          required:
          - self
          - blockContact
          properties:
            self:
              $ref: '#/components/schemas/link'
            fraudRiskInformation:
              $ref: '#/components/schemas/link'
            blockContact:
              $ref: '#/components/schemas/link'
        viewerType:
          type: string
          description: The type of the viewer of the P2P payment.
          const: Payee
          enum:
          - Payee
      required:
      - id
      - amount
      - status
      - created
      - updatedAt
      - _embedded
      - _links
      - viewerType
