    ProvisioningStatus:
      type: object
      description: 'Current state of the wallet provisioning. '
      required:
      - state
      properties:
        state:
          type: string
          description: Current state of the wallet provisioning. This enumeration is extensible, meaning that additional values may be accepted in the future.
          oneOf:
          - const: Pending
            description: The provisioning has been started and is in a pending state.
            title: Pending
          - const: PaymentSourcesProvisioned
            description: The consumer PSP provided payment sources.
            title: PaymentSourcesProvisioned
          - const: Completed
            description: The provisioning was successfully completed.
            title: Completed
          - const: Failed
            description: The provisioning failed or was cancelled.
            title: Failed
          - type: string
            not:
              enum:
              - Pending
              - PaymentSourcesProvisioned
              - Completed
              - Failed
            description: Any other provisioning state value.
            title: Any String
        reason:
          description: The reason why the provisioning was cancelled. This reason is provided only if the state is 'Failed' and the failure was due to a cancellation. This enumeration is extensible, meaning
            that additional values may be accepted in the future.
          type: string
          oneOf:
          - const: ConsumerCancelled
            description: The consumer cancelled the provisioning.
            title: ConsumerCancelled
          - const: ScaFailed
            description: Strong Customer Authentication failed.
            title: ScaFailed
          - const: TCSNotAccepted
            description: Terms and Conditions were not accepted.
            title: TCSNotAccepted
          - const: NoAccounts
            description: No accounts are available.
            title: NoAccounts
          - const: SecurityConcerns
            description: Security risks detected.
            title: SecurityConcerns
          - const: TechnicalError
            description: A technical error occurred.
            title: TechnicalError
          - const: UnknownError
            description: An unknown error occurred.
            title: UnknownError
          - const: Expired
            description: The provisioning expired.
            title: Expired
          - const: VerifierMismatch
            description: 'The PKCE-like verifiers were not correct during provisioning process. The provisioning was cancelled

              for security reasons.'
            title: VerifierMismatch
          - const: DuplicatedPaymentSource
            description: The payment source is already provisioned inside the wallet.
            title: DuplicatedPaymentSource
          - type: string
            not:
              enum:
              - ConsumerCancelled
              - ScaFailed
              - TCSNotAccepted
              - NoAccounts
              - SecurityConcerns
              - TechnicalError
              - UnknownError
              - Expired
              - VerifierMismatch
              - DuplicatedPaymentSource
            description: Any other cancellation reason value.
            title: Any String
    Currency:
      type: string
      description: The three-letter ISO 4217:2015 currency code for the transaction.
      oneOf:
      - const: EUR
        description: EPI's home currency.
        title: EPI's home currency
      - type: string
        not:
          enum:
          - EUR
        description: Any other currency.
        title: Any other currency
    AliasIdentifier:
      title: Alias account identifier
      type: object
      required:
      - type
      - alias
      - maskedIban
      description: The IBAN alias, which identifies the account if the PSP does not permit EPI to store IBANs.
      properties:
        type:
          type: string
          enum:
          - Alias
        alias:
          type: string
          description: The IBAN alias for this account.
          pattern: ^[-a-zA-Z0-9/?:().,'+\s]{8,50}$
        maskedIban:
          type: string
          description: 'The masked IBAN of this account. Since EPI has no information for generating a masked IBAN but needs the masked IBAN for display purposes, the PSP must provide the masked IBAN.

            '
          minLength: 8
          maxLength: 34
          example: DE12********7890
    ConstraintViolationProblem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that uniquely identifies the problem type only in the context of the provided endpoint.
          const: /problem/constraint-violation
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          default: Constraint Violation
        status:
          type: integer
          format: int32
          description: The 'status' member is only advisory; it conveys the HTTP status code used for the convenience of the consumer. This attribute is always the same as the status code in the actual
            HTTP response.
          default: 400
        callId:
          type: string
          description: A call ID that identifies the specific occurrence of the problem.
          example: 00000000000000000000000000000000-0000000000000000
        violations:
          type: array
          description: A list of constraint violations.
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
                description: The name of the field that caused the constraint violation.
              message:
                type: string
                description: A technical message that describes the constraint violation, in English.
              userMessageKey:
                type: string
                description: A key that describes the type of constraint violation, useful to report user input validation error. The key can be used to look up a localised message for instance, that can
                  then be interpolated using the `userMessageValue`.
                example: constraint.string.min-length
                oneOf:
                - type: string
                  title: Standard constraint violation key
                  description: 'All known standard constraint violation keys: * **constraint.required**: The field is required. * **constraint.type**: The field must be of the correct type. * **constraint.enum**:
                    The field must be one of the allowed values. `userMessageValue` contains the list as a string value. * **constraint.const**: The field must be a specific value. `userMessageValue` contains
                    the value as a string value. * **constraint.number.multiple-of**: The field must be a multiple of a specific number. `userMessageValue` contains the number as a string value. * **constraint.number.maximum-inclusive**:
                    The field must be less than or equal to a specific number. `userMessageValue` contains the number as a string value. * **constraint.number.maximum-exclusive**: The field must be less
                    than a specific number. `userMessageValue` contains the number as a string value. * **constraint.number.minimum-inclusive**: The field must be greater than or equal to a specific number.
                    `userMessageValue` contains the number as a string value.            * **constraint.number.minimum-exclusive**: The field must be greater than a specific number. `userMessageValue` contains
                    the number as a string value. * **constraint.string.max-length**: The field must be at most a specific number of characters long. `userMessageValue` contains the number as a string value.
                    * **constraint.string.min-length**: The field must be at least a specific number of characters long. `userMessageValue` contains the number as a string value. * **constraint.string.min-length-not-blank**:
                    The field must be at least a specific number of characters long and not blank. `userMessageValue` contains the number as a string value. * **constraint.string.max-graphemes**: The field
                    must be at most a specific number of graphemes long. `userMessageValue` contains the number as a string value. * **constraint.string.pattern**: The field must match a specific pattern.
                    * **constraint.string.length**: The field must be a specific number of characters long. `userMessageValue` contains the number as a string value. * **constraint.string.url**: The field
                    must be a valid URL. * **constraint.string.url-https**: The field must be a valid HTTPS URL. * **constraint.string.uuid4**: The field must be a valid UUID v4. * **constraint.string.email**:
                    The field must be a valid email address. * **constraint.string.phone-number**: The field must be a valid phone number. * **constraint.duration.min-seconds**: The field must be at least
                    a specific number of seconds long. `userMessageValue` contains the number as a string value. * **constraint.duration.max-days**: The field must be at most a specific number of days long.
                    `userMessageValue` contains the number as a string value. * **constraint.datetime.before**: The field must be before a specific date and time. `userMessageValue` contains the `datetime`
                    as a timestamp string value. * **constraint.array.min-items**: The field must contain at least a specific number of items. `userMessageValue` contains the number as a string value. *
                    **constraint.array.max-items**: The field must contain at most a specific number of items. `userMessageValue` contains the number as a string value. * **constraint.array.unique-items**:
                    The field must contain only unique items. * **constraint.amount.maximum**: The field must be less than or equal to a specific amount. * **constraint.amount.minimum**: The field must
                    be greater than or equal to a specific amount. * **constraint.currency-supported**: The field must be a supported currency.'
                  enum:
                  - constraint.required
                  - constraint.type
                  - constraint.enum
                  - constraint.const
                  - constraint.number.multiple-of
                  - constraint.number.maximum-inclusive
                  - constraint.number.maximum-exclusive
                  - constraint.number.minimum-inclusive
                  - constraint.number.minimum-exclusive
                  - constraint.string.max-length
                  - constraint.string.min-length
                  - constraint.string.min-length-not-blank
                  - constraint.string.max-graphemes
                  - constraint.string.pattern
                  - constraint.string.length
                  - constraint.string.url
                  - constraint.string.url-https
                  - constraint.string.uuid4
                  - constraint.string.email
                  - constraint.string.phone-number
                  - constraint.duration.min-seconds
                  - constraint.duration.max-days
                  - constraint.datetime.before
                  - constraint.array.min-items
                  - constraint.array.max-items
                  - constraint.array.unique-items
                  - constraint.amount.maximum
                  - constraint.amount.minimum
                  - constraint.currency-supported
                - type: string
                  description: Placeholder for a future user message key.
                  title: Placeholder for future message keys
                  not:
                    enum:
                    - constraint.required
                    - constraint.type
                    - constraint.enum
                    - constraint.const
                    - constraint.number.multiple-of
                    - constraint.number.maximum-inclusive
                    - constraint.number.maximum-exclusive
                    - constraint.number.minimum-inclusive
                    - constraint.number.minimum-exclusive
                    - constraint.string.max-length
                    - constraint.string.min-length
                    - constraint.string.min-length-not-blank
                    - constraint.string.max-graphemes
                    - constraint.string.pattern
                    - constraint.string.length
                    - constraint.string.url
                    - constraint.string.url-https
                    - constraint.string.uuid4
                    - constraint.string.email
                    - constraint.string.phone-number
                    - constraint.duration.min-seconds
                    - constraint.duration.max-days
                    - constraint.datetime.before
                    - constraint.array.min-items
                    - constraint.array.max-items
                    - constraint.array.unique-items
                    - constraint.amount.maximum
                    - constraint.amount.minimum
                    - constraint.currency-supported
              userMessageValue:
                type: string
                description: A string value that can be used to replace a placeholder in the localised message.
      required:
      - type
      - title
      - status
      - violations
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that uniquely identifies the problem type, only in the context of the provided endpoint.
          default: about:blank
          example: /some/uri-reference
          not:
            enum:
            - /problem/constraint-violation
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: some title for the error situation
        status:
          type: integer
          format: int32
          description: The 'status' member is only advisory; it conveys the HTTP status code used for the convenience of the consumer. This attribute is always the same as the status code in the actual
            HTTP response.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem, which helps locate the problem and describes how to proceed.
          example: some description for the error situation
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem, for example, by adding a fragment identifier or sub-path to the problem type. Can be used to locate the root
            of the problem in the source code.
          example: /some/uri-reference#specific-occurrence-context
        callId:
          type: string
          description: A call ID that identifies the specific occurrence of the problem.
          example: 00000000000000000000000000000000-0000000000000000
      required:
      - type
      - title
      - status
    PaymentSourceStatus:
      description: The status of the payment source. This enumeration is extensible; additional values might be added.
      oneOf:
      - const: Active
        description: The payment source is active.
        title: Active
      - const: Blocked
        description: The payment source is blocked.
        title: Blocked
      - const: Closed
        description: The payment source is closed.
        title: Closed
      - type: string
        not:
          enum:
          - Active
          - Blocked
          - Closed
        description: Placeholder for a future reason, to be defined.
        title: Any String
    AppIcon:
      type: object
      description: Icon of the registered consumer PSP app. This can either be a mobile or web specific application.
      properties:
        contentBase64:
          type: string
          description: The content of the image as a base64 data string.
          example: 
        type:
          type: string
          description: The type of the image as a media type string, either JPG or PNG.
          example: image/png
      required:
      - contentBase64
      - type
    IbanIdentifier:
      title: IBAN account identifier
      type: object
      required:
      - type
      - iban
      description: An IBAN, if the consumer PSP permits EPI to store IBANs. This IBAN must have a valid checksum and a country code from a supported country. For more information, see the [IBAN checker](https://www.iban.com/iban-checker)
        on the IBAN validation and calculation website.
      properties:
        type:
          type: string
          enum:
          - IBAN
        iban:
          $ref: '#/components/schemas/IBAN'
    link:
      type: object
      properties:
        href:
          type: string
          format: uri
        name:
          type: string
      required:
      - href
    walletProvisioningSchema:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID for finding/continuing the provisioning flow.
        consumerId:
          type: string
          format: uuid
          description: UUID of the consumer for whom this wallet is being provisioned.
        consumerPspId:
          type: string
          format: uuid
          description: UUID of the consumer PSP that is to provision the wallet.
        status:
          $ref: '#/components/schemas/ProvisioningStatus'
        paymentSources:
          type: array
          description: Consumer PSP's payment sources, for creating means of payment.
          items:
            $ref: '#/components/schemas/PaymentSourceResource'
        _links:
          type: object
          description: HAL links to related resources.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/link'
            redirect:
              $ref: '#/components/schemas/link'
            provisionPaymentSources:
              $ref: '#/components/schemas/link'
              description: Link to the location where the consumer PSP must create the payment sources. This link is available only when the Wallet Provisioning resource still contains no information about
                any payment sources.
            cancellation:
              $ref: '#/components/schemas/link'
              description: Link to the location where the consumer PSP or consumer can cancel the provisioning.  This link is available only when the Wallet Provisioning resource still in a pending state.
            paymentMeans:
              $ref: '#/components/schemas/link'
              description: Link to the location of the payment means created during this enrolment.  This link is available only when the Wallet Provisioning resource is in a completed state.
        _embedded:
          type: object
          description: Embedded, related resources.
          properties:
            consumerPsp:
              $ref: '#/components/schemas/ConsumerPSPEmbeddedDetailsSchema'
      examples:
      - id: ae6fa5c4-0ce1-4f72-a36a-6b55a2db3a85
        consumerId: 6f67424e-fa72-434a-a47a-d45443762ead
        consumerPspId: 00000000-0000-0000-0000-000000009002
        paymentSources:
        - type: PaymentAccount
          id: 2344f149-4a29-4191-bda8-ade602a460a0
          status: Active
          consumerPspId: 00000000-0000-0000-0000-000000009002
          externalId: 96a66fbe-79e3-41b1-ab4f-265a832f49c4
          accountIdentifier:
            type: IBAN
            iban: DE00112233000009769457
          pro: false
          currency: EUR
          displayDigits: DE89xxxxxxxxxxxxxx3000
          _links:
            self:
              href: https://spi.int.epi.engineering/api/wallets/6f67424e-fa72-434a-a47a-d45443762ead/provisionings/ae6fa5c4-0ce1-4f72-a36a-6b55a2db3a85/payment-sources/2344f149-4a29-4191-bda8-ade602a460a0
        status:
          state: Pending
        _links:
          self:
            href: https://spi.int.epi.engineering/api/wallets/6f67424e-fa72-434a-a47a-d45443762ead/provisionings/ae6fa5c4-0ce1-4f72-a36a-6b55a2db3a85
          redirect:
            href: https://app.weropay.eu/provisioning-done
          provisionPaymentSources:
            href: https://spi.int.epi.engineering/api/wallets/6f67424e-fa72-434a-a47a-d45443762ead/provisionings/ae6fa5c4-0ce1-4f72-a36a-6b55a2db3a85/provision-payment-sources
          cancellation:
            href: https://spi.int.epi.engineering/api/wallets/6f67424e-fa72-434a-a47a-d45443762ead/provisionings/ae6fa5c4-0ce1-4f72-a36a-6b55a2db3a85/cancellation
            name: cancelProvisioning
        _embedded: {}
      required:
      - id
      - consumerPspId
      - paymentSources
      - _links
      - status
      - _embedded
    IBAN:
      type: string
    InboundConsumerDeviceTelemetry:
      type: object
      title: Consumer device telemetry
      description: 'Telemetry data ("device fingerprint") of the device used by the consumer.


        EPI cannot guarantee consumer PSPs will send a complete set of consumer device telemetry properties, and therefore they are treated as optional.


        It is possible to send additional properties in this object, which EPI will pass on verbatim to EPI''s fraud scoring service provider for evaluation.


        This is to allow for easier integration on the consumer PSP side.


        However, PSPs are strongly encouraged to provide values for the properties as specified here where possible in order for EPI to provide the best possible fraud scoring.'
      additionalProperties: true
      properties:
        deviceIpAddress:
          description: The IPv4 or IPv6 address of the consumer's device.
          type: string
          example: 192.0.2.123
        devicePort:
          description: The ephemeral port of the consumer's device.
          type: integer
          example: 52314
        deviceUserAgent:
          description: The user agent string of the device used by the consumer. This will often contain information redundantly captured in the `deviceOs` and `deviceModel` properties.
          type: string
          maxLength: 256
          examples:
          - Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 ...
          - Mozilla/5.0 (Linux; Android 10; Pixel 3) AppleWebKit/537.36...
        deviceModel:
          description: The model of the device used by the consumer.
          type: string
          maxLength: 256
          examples:
          - iPhone12,1
          - Pixel 3
        deviceScreenResolution:
          description: The screen resolution of the device used by the consumer, in pixels (width x height).
          type: string
          examples:
          - 828x1792
          - 1080x2280
        deviceCellularProviders:
          type: string
          maxLength: 256
          description: The cellular provider(s) of the device used by the consumer. This is a comma-separated list of the names of the cellular providers.
          examples:
          - Telekom, Vodafone
          - T-Mobile
        deviceLocation:
          description: The location of the device used by the consumer. This is a comma-separated list of the latitude and longitude of the device.
          type: string
          example: 37.7749,-122.4194
        deviceTimeZone:
          description: The time zone of the device used by the consumer.
          type: string
          maxLength: 256
          example: America/Los_Angeles
        deviceId:
          description: 'The unique device identifier of the device used by the consumer. Note: Formats differ (UUID on iOS vs. 64-bit hex string on Android).'
          type: string
          maxLength: 256
          examples:
          - 6fc1c567-a4cd-45c5-9e44-c5a5b9a6f09a
          - 2b6f0cc904d137be2e1730235f5664094b831186
        deviceOs:
          description: The operating system of the device used by the consumer.
          type: string
          examples:
          - iOS
          - Android
        deviceLanguage:
          description: The language of the device used by the consumer.
          type: string
          example: en_US
        deviceTime:
          description: The time on the device used by the consumer, in ISO 8601 format.
          type: string
          format: date-time
          example: '2023-09-25T12:34:56Z'
    ConsumerPSPEmbeddedDetailsSchema:
      type: object
      properties:
        id:
          type: string
          description: Consumer PSP ID.
        name:
          type: string
          description: Consumer PSP name.
        countryCodeList:
          type: array
          description: List of codes of countries that the consumer PSP does business with in the ISO 3166-1 alpha-2 code format.
          items:
            $ref: '#/components/schemas/CountryCode'
        publicJwk:
          type: object
          description: Public key of the consumer psp, as a JWK.
          properties:
            kty:
              type: string
            n:
              type: string
            e:
              type: string
        redirectTemplate:
          type: string
          description: A URL template. The consumer is redirected to this URL to complete the provisioning of the wallet with means of payment. Must contain {walletId} and {provisioningId} as template fields.
        apps:
          type: array
          description: List of apps available for this consumer PSP.
          items:
            type: object
            description: Data about the App for this consumer PSP.
            properties:
              id:
                type: string
                format: uuid
                description: App ID.
              name:
                type: string
                description: App name.
              icon:
                $ref: '#/components/schemas/AppIcon'
              _links:
                type: object
                properties:
                  webRedirect:
                    $ref: '#/components/schemas/link'
                  deepRedirect:
                    $ref: '#/components/schemas/link'
                  universalRedirect:
                    $ref: '#/components/schemas/link'
        _links:
          type: object
          description: HAL links to related resources.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/link'
        _embedded:
          type: object
          description: Embedded, related resources.
          properties:
            meta:
              $ref: '#/components/schemas/consumerPspMetadata'
      required:
      - id
      - name
      - countryCodeList
      - _embedded
    consumerPspMetadata:
      type: object
      example:
        icon:
          contentBase64: 
          type: image/png
        textColor: '#000000'
        primaryColor: '#FFFFFF'
        secondaryColor: '#A0A0A0'
      title: Consumer PSP metadata
      description: This metadata is provided by the consumer PSP during enrolment with EPI and should be used by clients to display the correct corporate identity of the consumer PSP.
      properties:
        icon:
          $ref: '#/components/schemas/AppIcon'
        textColor:
          type: string
          pattern: ^#[0-9ABCDEFabcdef]{6}$|^rgb\(\d{1,3}, \d{1,3}, \d{1,3}\)$
          description: "> \u2757\uFE0F This field is deprecated and will be removed in March 2025.\nThe text colour as a CSS colour string."
          example: '#000000'
          deprecated: true
        primaryColor:
          type: string
          pattern: ^#[0-9ABCDEFabcdef]{6}$|^rgb\(\d{1,3}, \d{1,3}, \d{1,3}\)$
          description: The primary colour as a CSS colour string. Used mainly for backgrounds.
          example: '#FFFFFF'
        secondaryColor:
          type: string
          pattern: ^#[0-9ABCDEFabcdef]{6}$|^rgb\(\d{1,3}, \d{1,3}, \d{1,3}\)$
          description: "> \u2757\uFE0F This field is deprecated and will be removed in March 2025.\nThe secondary colour as a CSS colour string. Used mainly for buttons and borders."
          example: '#A0A0A0'
          deprecated: true
    PaymentSourceResourcePaymentAccount:
      type: object
      required:
      - type
      - id
      - consumerPspId
      - externalId
      - currency
      - status
      - pro
      - displayDigits
      - _links
      properties:
        id:
          type: string
          format: uuid
          description: Payment source ID.
        type:
          type: string
          enum:
          - PaymentAccount
        consumerPspId:
          type: string
          format: uuid
          description: PSP ID of the payment source.
        externalId:
          type: string
          description: External ID of the payment source, provided by the consumer PSP. Uniquely identifies a payment source outside of the EPI context. For EPI to correlate payment sources across different
            wallet installations, consumer PSPs must provide the same external ID for a particular payment source across wallets.
        accountHolder:
          type: string
          description: Name of the account holder.
        accountIdentifier:
          $ref: '#/components/schemas/AccountIdentifier'
        currency:
          $ref: '#/components/schemas/Currency'
        pro:
          type: boolean
          description: Indicates whether the payment account is a 'pro' account, for P2Pro payments.
        status:
          $ref: '#/components/schemas/PaymentSourceStatus'
        displayDigits:
          type: string
          description: The display digits of the account identifier. This field can be used for end-user display purposes, such as a masked IBAN.
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/link'
      examples:
      - id: e369792d-ce10-4fb3-afbf-6a9632cb5156
        type: PaymentAccount
        consumerPspId: d6de77b0-e129-49ec-ae13-6ccec0c8c692
        externalId: a4912834-0e8b-41cb-a5ce-992bfa51279f
        accountHolder: John Doe
        accountIdentifier:
          type: IBAN
          iban: DE89370400440532013000
        currency: EUR
        status: Active
        displayDigits: DE89xxxxxxxxxxxxxx3000
        countryCode: DE
        pro: false
        _links:
          self:
            href: https://api.epi-services.eu/api/payment-sources/e369792d-ce10-4fb3-afbf-6a9632cb5156
    AccountIdentifier:
      description: 'A polymorphic type that identifies an account. The value can be of one of the following types.

        - An IBAN, if the consumer PSP permits EPI to store IBANs. This IBAN must have a valid checksum and a country code from a supported country. For more information, see the [IBAN checker](https://www.iban.com/iban-checker)
        on the IBAN validation and calculation website.

        - An alias for the IBAN, if the consumer PSP does not permit EPI to store IBANs.

        '
      type: object
      oneOf:
      - $ref: '#/components/schemas/IbanIdentifier'
      - $ref: '#/components/schemas/AliasIdentifier'
      discriminator:
        propertyName: type
        mapping:
          IBAN: '#/components/schemas/IbanIdentifier'
          Alias: '#/components/schemas/AliasIdentifier'
    VerifierHash:
      type: string
      description: "Represents a SHA256 hash of a random value. The binary representation of the hash value is encoded in base64. The\nrandom value must consist of at least 256 bits and be generated by\
        \ a cryptographically-secure random source. This is\nthe hashed counterpart of the verifier.\n\nExamples can be generated with:\n```shell\n$ openssl rand 32 | openssl sha256 --binary | base64 \n\
        ```\n"
      contentEncoding: base64
      example: ph6EN9uE1AEOooAMEPfwdCQTWbv/oebmt5ifV9KNTTM=
