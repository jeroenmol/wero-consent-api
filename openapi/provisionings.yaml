openapi: 3.0.0
info:
  title: Provisionings API
  version: 1.0.0
  description: API specification for provisionings resource
servers:
- url: https://api.example.com
paths:
  /api/provisionings:
    servers: []
    post:
      operationId: post-provisionings
      summary: Initiate a new provisioning [Wallet]
      description: '## Wallet provisioning

        A Wero digital wallet app can create a payment source provisioning resource at EPI central services. Payment source provisioning is the process of registering a consumer''s account with its wallet.

        The consumer PSP adds information about the consumer''s eligible payment sources to the wallet provisioning resource. The process continues with the creation of a different resource. See Wallet
        means of payment.


        If the consumer creates further wallets, the provisioning process must be repeated because each wallet is tightly coupled with unique means of payment to ensure security.


        ## Create a wallet provisioning resource

        The wallet app creates a wallet provisioning resource at EPI central services.

        This endpoint supersedes: [create a wallet provisioning resource](ref:post-wallet-provisioning).


        ## Scope

        This endpoint requires the `wallet:provisioning` scope. '
      tags:
      - wallet-provisionings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                consumerPspId:
                  type: string
                  format: uuid
                  description: UUID of the consumer PSP that is to provision the wallet.
                consumerDeviceTelemetry:
                  $ref: '#/components/schemas/InboundConsumerDeviceTelemetry'
                userVerifierHash:
                  $ref: '#/components/schemas/VerifierHash'
              required:
              - consumerPspId
              - userVerifierHash
            examples:
              post-provisioning:
                value:
                  consumerPspId: 00000000-0000-0000-0000-000000001080
                  consumerDeviceTelemetry:
                    deviceModel: iPhone12,1
                    deviceScreenResolution: 828x1792
                    deviceCellularProviders: Telekom, Vodafone
                    deviceLocation: 52.520008,13.404954
                    deviceTimeZone: America/Los_Angeles
                    deviceId: 6fc1c567-a4cd-45c5-9e44-c5a5b9a6f09a
                    deviceOs: iOS
                    deviceLanguage: en_US
                    deviceTime: '2023-09-25T12:34:56Z'
                    deviceUserAgent: Mozilla/5.0 (iPhone; CPU iPhone OS 13_3 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.5 Mobile/15E148 Safari/604.1
                    deviceIpAddress: 192.0.2.123
                    additionalPropertyExample: some value
                  userVerifierHash: MWZjZWE2OWZhN2ZiZjUzNTRkMDgzZDAzODU0YzRlOTlkYTNlZTZiMzA5OGRhYzMwYjJjNDg2MWQ4NTg5NmZiZiAgLQo=
      responses:
        '201':
          description: '201'
          headers:
            Location:
              description: URL that points to the location of the new wallet provisioning resource. For more information about this response header, see [MDN web documentation](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Location).
              schema:
                type: string
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/walletProvisioningSchema'
              examples:
                post-wallet-provisioning:
                  value:
                    id: 4c17de33-11d4-43ff-9eb4-821a08af7798
                    consumerId: a3c5c713-4f5b-4b7e-8a76-4ce3eeecb3fa
                    status:
                      state: Completed
                    consumerPspId: 00000000-0000-0000-0000-000000009012
                    paymentSources: []
                    _embedded:
                      consumerPsp:
                        id: 00000000-0000-0000-0000-000000009012
                        name: ING DE
                        countryCodeList:
                        - DE
                        _links:
                          self:
                            href: http://consumer-psp:8086/api/consumer-psps/00000000-0000-0000-0000-000000009012
                        _embedded:
                          meta:
                            icon:
                              contentBase64: 
                              type: image/png
                            textColor: '#000000'
                            primaryColor: '#FFFFFF'
                            secondaryColor: rgb(255, 98, 0)
                    _links:
                      self:
                        href: https://spi.int.epi.engineering/api/wallets/2d24dd9e-60af-4296-afbf-e55aab9588f1/provisionings/4c17de33-11d4-43ff-9eb4-821a08af7798
                      redirect:
                        href: https://consumer-psp.tld/epi/provisionings/4c17de33-11d4-43ff-9eb4-821a08af7798/2d24dd9e-60af-4296-afbf-e55aab9588f1
                      provisionPaymentSources:
                        href: https://spi.int.epi.engineering/api/wallets/2d24dd9e-60af-4296-afbf-e55aab9588f1/provisionings/4c17de33-11d4-43ff-9eb4-821a08af7798/provision-payment-sources
        '400':
          $ref: '#/components/responses/errorResponse400'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '422':
          description: Unprocessable Entity - The request was well formed but was not followed due to semantic errors.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ConsumerPspIsBeingMerged:
                  $ref: '#/components/examples/ConsumerPSPIsBeingMergedProblem'
        '502':
          $ref: '#/components/responses/errorResponse502'
