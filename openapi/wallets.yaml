      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL that points to the location of the new wallet resource. For more information about this response header, see [MDN web documentation](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Location).
              schema:
                type: string
