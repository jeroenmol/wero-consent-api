      description: 'Consumer PSPs and consumers can retrieve a list of all active wallets that they have provisioned.

        If the request is made with a wallet access token containing a specific consumer ID, the endpoint will respond with all wallets created for that consumer ID. If the request is made with a consumer
        PSP access token containing a specific consumer PSP ID, the endpoint will respond with all wallets created by that consumer PSP.

        The list is paginated. Retrieving the full list might require multiple API calls when `page.totalPages` is greater than `0`. For more information, see [Pagination](/platform/reference/pagination).

        ## Scope

        This endpoint call does not require a scope.'
      security:
      - BearerAccessToken: []
      summary: List provisioned wallets [Consumer PSP and Wallet]
    post:
      tags:
      - wallets
      operationId: post-wallet
      parameters: []
