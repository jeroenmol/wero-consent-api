                    type: Mobile
                    device:
                      id: 4c4256ad-4e32-4543-ac52-ea63d7e26cdb
                      name: Johnnys Phone
                      model: Pixel 7a
                      os: Android
                    app:
                      id: de.epicompany.wallet
                      name: EPI Wallet
