        propertyName: type
        mapping:
          IBAN: '#/components/schemas/IbanIdentifier'
          Alias: '#/components/schemas/AliasIdentifier'
    EllipticCurvePublicJWK:
      title: Elliptic Curve Public Key
      type: object
      description: "Public key of an asymmetric elliptic-curve key pair.  \nRepresented as  JSON Web Key (JWK) https://www.rfc-editor.org/rfc/rfc7517"
      properties:
        kid:
          type: string
          description: Key ID
          example: 74cf2532-c6c2-4586-acb3-6fce198acc5b
        kty:
          type: string
          description: 'Key Type: RSA or EC'
          const: EC
        use:
          type: string
          description: Indicates whether a JWK is used for encrypting data or verifying the signature on data. Here, always `sig`.
          const: sig
        alg:
          type: string
          description: Identifies the algorithm intended for use with the key.
          enum:
          - ES256
          - ES384
          - ES512
        crv:
          type: string
          description: Name of selected curve
          enum:
          - P-256
          - P-384
          - P-521
        x:
          type: string
          description: X Coordinate
        y:
          type: string
          description: Y Coordinate
      required:
      - kid
      - kty
      - crv
      - x
      - y
