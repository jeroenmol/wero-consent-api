              schema:
                $ref: '#/components/schemas/WalletSchema'
              examples:
                post-wallet:
                  value:
                    id: 0fc3130f-5640-4453-8f27-129e860c8727
                    walletName: Some Wallet
                    host:
                      type: Mobile
                      device:
                        id: 58c56856-e7c6-403a-9594-3e8ca1ceff0e
                        name: Johnnys iPhone
                        model: iPhone 14
