openapi: 3.0.0
info:
  title: Wallets API
  version: 1.0.0
  description: API specification for wallets resource
servers:
- url: https://api.example.com
paths:
  /api/wallets:
    servers: []
    get:
      tags:
      - wallets
      operationId: list-wallet-by-consumer-psp
      parameters:
      - name: page
        in: query
        description: The requested page number.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: The requested page size. The data is split into pages of this size, and the numbering depends on this page size.
        required: false
        schema:
          type: integer
          minimum: 10
          maximum: 100
          default: 10
      - name: sort
        in: query
        description: The sorting order. See [Pagination](ref:pagination) for more information.
        required: false
        schema:
          type: string
          default: created:desc
      responses:
        '200':
          description: '200'
          content:
            application/hal+json; charset=UTF-8:
              schema:
                type: object
                required:
                - _links
                - _embedded
                - page
                properties:
                  _links:
                    $ref: '#/components/schemas/PagedCollectionResourceLinks'
                  _embedded:
                    type: object
                    required:
                    - wallets
                    properties:
                      wallets:
                        type: array
                        items:
                          $ref: '#/components/schemas/WalletSchema'
                  page:
                    $ref: '#/components/schemas/page'
              examples:
                Example 1:
                  value:
                    page:
                      size: 1
                      totalElements: 1
                      totalPages: 1
                      number: 0
                      requestedPageSize: 10
                      limitReached: false
                    _links:
                      self:
                        href: https://api.epi-services.eu/api/wallets
                      first:
                        href: https://api.epi-services.eu/api/wallets
                      last:
                        href: https://api.epi-services.eu/api/wallets?page=5
