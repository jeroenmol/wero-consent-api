    AccountIdentifier:
      description: 'A polymorphic type that identifies an account. The value can be of one of the following types.

        - An IBAN, if the consumer PSP permits EPI to store IBANs. This IBAN must have a valid checksum and a country code from a supported country. For more information, see the [IBAN checker](https://www.iban.com/iban-checker)
