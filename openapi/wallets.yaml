      security:
      - BearerAccessToken: []
      summary: Create a wallet resource [Wallet]
      description: "## Wallets\nA Wero digital wallet on a consumer\u2019s mobile device can hold one or more means of payment that are owned by the consumer. Wallets are represented technically by private/public\
        \ key pairs for authenticating consumers.\n\n### Create a wallet resource\nWero digital wallet apps can register themselves with EPI central services by creating a Wallet resource through the following\
        \ API request.\nNo two wallets can have the same ID. If the wallet creation call is triggered twice for the same device ID but with different public keys, two wallets are created with different\
        \ wallet IDs. Every time the app is reinstalled even on the same device, the ID must change.\n## Scope\nThis endpoint call does not require a scope."
components:
  schemas:
    WalletPublicKey:
      title: Public key of the wallet instance on the device.
      type: object
      description: Public key of a key pair for the wallet instance on the device. The key must be [unique to the wallet](doc:wallets-and-cryptography#uniqueness-of-public-keys). Represented as a JSON Web
        Key ([JWK](https://www.rfc-editor.org/rfc/rfc7517)).
      oneOf:
      - $ref: '#/components/schemas/RSAPublicJWK'
      - $ref: '#/components/schemas/EllipticCurvePublicJWK'
      discriminator:
        propertyName: kty
        mapping:
          RSA: '#/components/schemas/RSAPublicJWK'
          EC: '#/components/schemas/EllipticCurvePublicJWK'
    RSAPublicJWK:
      title: RSA Public Key
      type: object
      description: "Public key of an asymmetric RSA key pair.    \nRepresented as JSON Web Key ([JWK](https://www.rfc-editor.org/rfc/rfc7517))."
      properties:
        kid:
          type: string
          description: Key ID
          example: 74cf2532-c6c2-4586-acb3-6fce198acc5b
        kty:
          type: string
          description: 'Key Type: RSA or EC'
          const: RSA
        use:
          type: string
          description: Indicates whether a JWK is used for encrypting data or verifying the signature on data. Here, always `sig`.
          const: sig
        alg:
          type: string
          description: Identifies the algorithm intended for use with the key.
          enum:
          - RS256
          - RS384
          - RS512
        n:
          type: string
          description: Modulus. Base64Url encoded.
          example: vZl9LV2lmdaSn1CTfrpbIbkhuJZ4C-mb33JTSXGB9q7GuSW_eiFz5SUOK2p5JIXznabbazaywpYhyMBpw7tbnKSzBuQxRKQHPD-Li1hhV4abjr570hGmc0UyftpBWZz4_53-q6lp0hupi8getzDyfPiiDZvgyKIGHytYSvZCGeVHXzJQy6DNf2xyZxG8WwgKvpIcOi0FvlVDJgdlIQn3HGrW3xK1IJpHLzh_ucYDIhs4L864hdV2QzUZA7d_agbk7dbq7ZStZNF4J_KmbruouQ_edglZurKeh6xmiRcOqGfWqN-4gJXAT4gN6w_eslfkPAKRDOcyh4ig8GopQ6CD9w
        e:
          type: string
          description: Exponent. Base64Url encoded.
          example: AQAB
      required:
      - kid
      - kty
      - n
      - e
    PaymentSourceResource:
      type: object
      description: ''
      oneOf:
      - $ref: '#/components/schemas/PaymentSourceResourcePaymentAccount'
      discriminator:
        propertyName: type
        mapping:
          PaymentAccount: '#/components/schemas/PaymentSourceResourcePaymentAccount'
    PaymentMeansSchema:
      type: object
      title: Wallet means of payment
      description: 'A means of payment (or payment means) is a digital representation of a consumer''s payment source.


        In the process of provisioning a Wero digital wallet, the consumer PSP adds information about the consumer''s payment sources to the Wallet Provisioning resource. Then, for each payment source,
        the Wero digital wallet creates a ''paymentMeans'' resource, which is a sub-resource of the Wallet resource. The ''paymentMeans'' resources contain the payment source information.


        When consumers consent to payments in their Wero digital wallets, they choose a means of payment, which indicates to the consumer PSP the payment source that the money is to come out of.'
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the means of payment.
        consumerPspId:
          type: string
          format: uuid
          description: ID of the consumer PSP that provisioned the means of payment.
        publicKey:
          $ref: '#/components/schemas/PaymentMeansPublicKey'
        paymentSourceId:
          type: string
          format: uuid
          description: ID of the corresponding payment source.
        paymentSourceType:
          $ref: '#/components/schemas/PaymentSourceType'
        consumerInformation:
          type: object
          description: Object containing information about the corresponding consumer.
          properties:
            consumerId:
              type: string
              format: uuid
              description: ID of the corresponding consumer.
            status:
              type: string
              description: The status of the corresponding consumer.
              oneOf:
              - const: Active
                description: The consumer is active.
                title: Active
              - const: Blocked
                description: The consumer is blocked.
                title: Blocked
              - const: PendingConfirmation
                description: The consumer is blocked and currently undergoing a screening in the Wero standalone app.
                title: PendingConfirmation
              - type: string
                not:
                  enum:
                  - Active
                  - Blocked
                  - PendingConfirmation
                description: Placeholder for a future status, to be defined.
        _embedded:
          type: object
          description: Embedded related resources.
          properties:
            consumerPsp:
              $ref: '#/components/schemas/consumerPSPDetailsSchema'
            paymentSource:
              $ref: '#/components/schemas/PaymentSourceResource'
            paymentSourceProfile:
              type: object
              description: 'The payment source profile describes how the consumer''s payment information is displayed to other consumers and includes the payment source proxies. '
              properties:
                id:
                  type: string
                displayName:
                  type: string
                isDisplayNameObfuscated:
                  type: boolean
                  description: Indicates whether the consumer has chosen to display only an obfuscated (pseudonymised/masked) version of their name, instead of their full name, to other consumers in P2P
                    transactions. By default, only the obfuscated name is displayed.
                paymentSourceProxies:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      id:
                        type: string
                      value:
                        type: string
        _links:
          type: object
          description: HAL links to related resources.
          properties:
            self:
              $ref: '#/components/schemas/link'
      required:
      - id
      - _links
      - paymentSourceId
      - consumerPspId
      - publicKey
      - _embedded
