          - self
      required:
      - payload
      - createdAt
      - expiresAt
      - _links
    paymentRuleResourceItemCyclic:
      type: object
      properties:
        type:
          type: string
          description: 'Type of the payment rules: fixed, cyclic or sliding.'
          enum:
          - Cyclic
        constraint:
          $ref: '#/components/schemas/paymentRuleResourceItemConstraint'
        startOffset:
          type: string
          description: An offset (compliant with ISO 8601) that defines the start time of the window during which payment can be collected.   The start time is then the offset amount of time _after_ the
