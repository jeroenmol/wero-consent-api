      responses:
        '200':
          description: OK
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/consentPaymentRulesResource'
              examples:
                Rules for a single, immediate payment:
                  value:
                    paymentRules:
                      - type: Fixed
                        constraint:
                          type: Single
                          maxAmount:
                            euroCents: 1999
                        startOffset: PT-5S
                        windowDuration: PT5M
                    _links:
                      self:
                        href: https://checked.local.epi.rocks/api/consents/5f7c8ca7-581a-43cb-ba27-08409c1cfb4b/payment-rules
