      summary: Retrieve the current, valid consent token of a consent resource [Wallet, Acceptor PSP or Consumer PSP]
      description: |-
        When a consumer consents to an acceptor's payment plan, the consumer's Wero digital wallet creates a consent token. The acceptor PSP can send the consent token to the consumer PSP as proof of the consumer's consent to one or more payments.

        A consent resource can have multiple consent tokens, but only the most recent consent token can be valid. For more information, see [Updated versions of consent tokens](doc:consent-model-technical-description#updated-versions-of-consent-tokens).

        The wallet, acceptor PSP or consumer PSP can make this endpoint call to retrieve the current, valid consent token by specifying the ID of the consent resource (the `consentId`).
        ## Scope
        This endpoint call does not require a scope.
      responses:
        '200':
          description: OK
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/consentTokenResource'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '502':
          $ref: '#/components/responses/errorResponse502'
        '503':
          $ref: '#/components/responses/errorResponse503'
    put:
      tags:
        - consents
      x-slo:
        availability: 99.95
        latency:
          p95: 300
          p99: 600
          max: 1800
        throughput: N/A
        severity: SEV 1
        status: DRAFT
      operationId: put-current-token
      security:
        - BearerAccessToken: []
      summary: Add a new consent token to a consent resource [Wallet]
      description: |-
        When a consumer consents to an acceptor's payment plan, the consumer's Wero digital wallet creates a consent token. The acceptor PSP can send the consent token to the consumer PSP as proof of the consumer's consent to one or more payments.

        A consent resource can have multiple consent tokens, but only the most recent consent token can be valid. For more information, see [Updated versions of consent tokens](doc:consent-model-technical-description#updated-versions-of-consent-tokens).

        By making this endpoint call, the wallet:
         - Invalidates the current, valid consent token of the consent resource (if one exists)
         - Adds a new consent token to the consent resource, which becomes the current, valid token

        The signature and payload of the new consent token are verified to ensure that the token fits the consent resource.
        ## Note:
        Until November 2026: - the `consentedAt` timestamp of the new token payload can either match the value contained in the initial token or can point to the current time. - the `expiresAt` timestamp does not have a validation, it can either match the value contained in the initial token or can point to a any time in the future, recommended is the calculation that is required from November 2026 on.
        After November 2026: - the `consentedAt` timestamp in the new token payload must point to the current time. - the `expiresAt` timestamp in the new token payload must equal the `consentedAt` timestamp plus the `durationUntilExpiry` from the consent resource.
        The consumer's wallet can invoke this endpoint, providing a modified token payload in the `paymentRules.constraint.maxAmount.euroCents` field, to adjust the `maxAmount` value of a Consumer Present Future Payment Plan.
        ## Scope
        This endpoint call does not require a scope.
        **⚠️ Advance notice of breaking change**. The field `token` located in the request payload will be subject to a hard limit of specified `maxLength` characters starting 16 July 2026.
        **⚠️ Advance notice of breaking change**. The field `consentedAt` located in the consent token payload will be required to contain a timestamp that is set to 'now' starting 01 November 2026.
      requestBody:
        description: The new consent token
        content:
          application/json; charset=UTF-8:
            schema:
              $ref: '#/components/schemas/updateCurrentTokenRequest'
            examples:
              Update current token:
                value:
                  token: eyJraWQiOiJkYjViNmRiYy0zNzJkLTQ5NWEtYWYzZC00Y2FiYzZjMjhi..(shortened)..ozDuBNg
      responses:
        '200':
          description: OK
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/consentTokenResource'
              examples:
                Token resource:
                  value:
                    token: eyJraWQiOiJkYjViNmRiYy0zNzJkLTQ5NWEtYWYzZC00Y2FiYzZjMjhi..(shortened)..ozDuBNg
                    _links:
                      self:
                        href: https://checked.local.epi.rocks/api/consents/5f7c8ca7-581a-43cb-ba27-08409c1cfb4b/current-token
        '204':
          description: No Content
        '400':
          description: Bad Request - The request is malformed.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/ConstraintViolationProblem'
              examples:
                generic:
                  value:
                    title: Bad Request
                    type: about:blank
                    status: 400
                    callId: 00000000000000000000000000000000-0000000000000000
                ConstraintViolationProblem:
                  value:
                    title: Constraint Violation
                    type: /problem/constraint-violation
                    status: 400
                    violations:
                      - field: .somefield
                        message: Must have valid format.
                    callId: 00000000000000000000000000000000-0000000000000000
                ConsentTokenNotDecodable:
                  value:
                    title: Consent token not decodable
                    type: /problem/consent/consent-token-not-decodable
                    status: 400
                    detail: 'Consent token not decodable: Unexpected JSON token at offset 0: Expected start of the object ''{'', but had ''['' instead at path: $'
                    callId: 00000000000000000000000000000000-0000000000000000
                IllegalConsentTokenPayload:
                  value:
                    title: Illegal consent token payload
                    type: /problem/consent/illegal-consent-token-payload
                    status: 400
                    detail: Token payload validation failed
                    conflictingFields:
                      - expiresAt
                      - consentedAt
                    callId: 00000000000000000000000000000000-0000000000000000
                ConsentTokenOutsideAllowedTimeWindow:
                  value:
                    title: Consent token outside allowed time window
                    type: /problem/consent/consent-token-outside-allowed-time-window
                    status: 400
                    detail: Field `consentedAt` is outside of the allowed time window (between 2024-12-02T10:00:00Z and 2024-12-02T10:15:00Z).
                    allowedWindow:
                      start: '2024-12-02T10:00:00Z'
                      endInclusive: '2024-12-02T10:15:00Z'
                    callId: 00000000000000000000000000000000-0000000000000000
                ConsentTokenInsufficientValidity:
                  value:
                    title: Consent token does not have sufficient validity
                    type: /problem/consent/consent-token-insufficient-validity
                    status: 400
                    detail: The token lifetime in `expiresAt` must be in the future, and must be 2024-12-02T10:00:00Z (or later).
                    minimumValidity: '2024-12-02T10:00:00Z'
                    callId: 00000000000000000000000000000000-0000000000000000
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '422':
          description: Unprocessable Entity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                InactivePaymentSource:
                  value:
                    type: about:blank
                    status: 422
                    title: Unprocessable Entity
                    detail: PaymentSource 0c955f12-96ee-4598-a461-6cad036775e0 is inactive and not eligible for granting consents.
                    callId: 00000000000000000000000000000000-0000000000000000
        '500':
          $ref: '#/components/responses/errorResponse500'
        '502':
          $ref: '#/components/responses/errorResponse502'
        '503':
          $ref: '#/components/responses/errorResponse503'

  /api/consents/{consentId}/qr-code:
    servers: []
    parameters:
      - $ref: '#/components/parameters/consentId'
      - in: query
        name: size
        description: The target size, in pixels, of the QR code might not necessarily match the final image size. This is because not all sizes can be achieved based on the given QR code cells. However, the image will be rendered as close as possible to the requested pixel dimensions. The default size is 1000px.
        schema:
