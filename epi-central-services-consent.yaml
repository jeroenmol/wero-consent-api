      operationId: post-create-offline-qr-code-consent
      security:
        - BearerAccessToken: []
      deprecated: true
      description: |-
        > ❗️ This endpoint is deprecated. Use [Decode information from a share URL \[Wallet\]](ref:post-api-share-url-decode) instead.
               The endpoint will be removed in June, 2026.

        Create a payment consent from a scanned invoice QR code. When creating this consent, the following steps will occur:
        1. EPI central services will notify the acceptor PSP associated with the acceptor that a consumer wants to initiate a payment to the acceptor. The acceptor information is specified in the request body.
        2. The acceptor PSP will initiate its own request to [create the payment consent](ref:requestconsent) for the consumer.
        3. EPI central services will return the created payment consent to the consumer in this call.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/payconiqOfflineQRCodeRequest'
                - $ref: '#/components/schemas/weroOfflineQRCodeRequest'
              discriminator:
                propertyName: type
                mapping:
