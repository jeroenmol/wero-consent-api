      operationId: revoke-consent
      security:
        - BearerAccessToken: []
      summary: Revoke consent [Wallet, Acceptor PSP, Consumer PSP]
      description: |-
        After a consent for a subscription or consumer present future payment is granted, this consent can be revoked.   This operation can be triggered by the consumer themselves (from their application), the consumer PSP (for example, in case of a fraud)  or the acceptor PSP (for example, when the acceptor PSP stops the subscription at the request of the acceptor).
        The `Revoked` state is terminal and the consent will no longer be usable.
        The status of the consent resource changes to `Revoked`.
        Calling this endpoint on a consent that is not in the `Granted` state will result in a 422 Unprocessable Entity error.
        ## Scope
        This endpoint call does not require a scope.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
