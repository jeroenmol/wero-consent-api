    get:
      summary: List consent resources [Wallet or Acceptor PSP]
      description: |-
        ## Consent resources
        The consent resource collates information about the consent and status of the consent request. It also includes various sub-resources.
        ## Filtering options [Wallet]
        To retrieve a consent resource by its short ID, specify `findBy=shortId` and `shortId={shortId}`.
        To retrieve consent resources by their payment means ID, specify `findBy=paymentMeansId` and `paymentMeansId={paymentMeansId}`.
        To retrieve the consent resources for all the consumer IDs of the wallet, specify only `findBy=consumerId`.
        ## Filtering options [Acceptor PSP]
        To retrieve a consent resource by the order reference ID, specify `findBy=orderReferenceId` and `orderReferenceId={orderReferenceId}`.
        ## Scope
        This endpoint call does not require a scope.
      parameters:
        - in: query
          name: findBy
          description: The field to search by. This field is required if the endpoint is accessed by the [wallet]. It is optional if accessed by the [acceptor PSP].
          schema:
            type: string
            enum:
              - orderReferenceId
              - shortId
              - paymentMeansId
              - consumerId
              - paymentPlan
        - in: query
          name: orderReferenceId
          description: The acceptor's order reference ID. The ID that the acceptor identifies the order with.
          schema:
            type: string
        - in: query
          name: shortId
          description: The short ID of the consent resource. This is also known as the Wero short code. This ID contains 10 alphanumerical characters. The alphabetical characters are all capital letters. The consumer can enter this ID if, for example, they cannot scan the QR code. Although the short ID contains no hyphens, it is displayed with hyphens to aid readability in the Wero digital wallet.
          schema:
            type: string
        - in: query
          name: paymentMeansId
          description: The ID of the means of payment that the consumer used to consent to the payment plan.
          schema:
            type: string
            format: uuid
        - in: query
          name: paymentPlan
          description: If provided, only consents that have the specified payment plan type are returned.
          schema:
            type: string
            enum:
              - C2c
              - EventDependent
              - SingleImmediate
              - Subscription
              - ConsumerPresentFuturePayment
      tags:
        - consents
