    post:
      summary: Request consent of a consumer [Acceptor PSP]
      description: |-

        ## Payment consent
        In the Wero payment consent model, a consumer PSP authorises payments from a consumer's account only if it has proof that the consumer consented to the payments. The consumer consents to a payment plan proposed by the acceptor, thereby granting the acceptor the right to request one or more payments from the consumer PSP in accordance with conditions defined in the payment plan.
        Consent to payment plans enables the implementation of recurring payments, such as subscription payments. The concept of payment plans is also leveraged for single, immediate payments, such as for the purchase of an item in a web shop.

        For more information, see [Overview of the Wero payment consent model](doc:consent-model-concept).
        ## Requesting consent
        The acceptor PSP calls this endpoint to request a consumer to consent to a payment plan. Technically, the acceptor PSP creates a consent resource at EPI central services. The acceptor PSP must provide all relevant data for example, the payment plan, acceptor name, and acceptor ID. EPI central services then uses the consent resource to ask the consumer to consent to the payment plan.
        **⚠️ Advance notice of breaking change**. The fields `id`, `name`, `mcc` and `countryCode` located inside `acceptor`, fields `id` and `name` located inside `shop`, field `format` located inside `printOptions`, field `orderPageUrl` located inside `details` and fields `orderReferenceId`, `returnUrl` and `callbackUrl` located in the request payload will be subject to a hard limit of specified `maxLength` characters starting 16 July 2026.

        ## Scope
        This endpoint call requires the `consent:request` scope. When requesting a C2C consent, the `consent:c2cRequest` scope is required.
