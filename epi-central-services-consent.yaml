          p99: 400
          max: 1200
        throughput: N/A
        severity: SEV 1
        status: DRAFT
      operationId: get-consent
      security:
        - BearerAccessToken: []
      summary: Retrieve a consent resource by consent ID [Wallet or Acceptor PSP]
      description: |-
        If an acceptor PSP already made an endpoint call to [request consent of a consumer](ref:requestconsent), a consent resource will have been created at EPI central services. The consent resource collates all information about the content and status of the consent request and includes various sub-resources.

        The wallet or the acceptor PSP can make this endpoint call to retrieve a payment plan sub-resource by specifying the `consentId` of the consent resource.
        Consent can be retrieved only by the same consumer who has been granted the consent.
        ## Scope
        This endpoint call does not require a scope.
      responses:
        '200':
          description: OK
          headers:
            Date:
              $ref: '#/components/headers/Date'
              description: |
                The date and time at which the response was generated.
                Clients should use the date information to accommodate for clock skew of local devices when signing consent tokens.
          content:
            application/hal+json; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/consentResource'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '502':
          $ref: '#/components/responses/errorResponse502'
        '503':
