      summary: Retrieve the payment rules of a consent resource [Wallet]
      description: |-
        As well as a _payment plan_ sub-resource, the consent resource also has a _payment rules_ sub-resource. The payment rules are a parameterised version of the payment plan. The payment plan is easier than the payment rules for people to read and understand. When a consumer grants consent, the payment rules resource is encoded in the consent token.

        The wallet can make this endpoint call to retrieve a payment rules sub-resource by specifying the `consentId` of the consent resource.
        ## Scope
