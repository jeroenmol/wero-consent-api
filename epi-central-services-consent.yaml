  /api/consents/{consentId}/shop-front:
    servers: []
    parameters:
      - $ref: '#/components/parameters/consentId'
    get:
      tags:
        - consents
      x-slo:
        availability: 99.95
        latency:
          p95: 250
          p99: 400
          max: 1200
        throughput: N/A
        severity: N/A
        status: DRAFT
      operationId: get-consent-shop-front
      security:
        - BearerAccessToken: []
      summary: Retrieve the shop-front of a consent resource
      description: |-
        The consent resource has a _shop front_ sub-resource. The _shop front_ sub-resource contains the website URL, the shop name, the shop logo, and a fallback logo identifier of the acceptor. If the shop logo is not available, the wallet can use the fallback logo identifier to display a fallback logo.

        The wallet can call this endpoint to retrieve a shop front sub-resource by specifying the `consentId` of the consent resource.
        ## Scope
