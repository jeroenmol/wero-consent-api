      summary: Deny consent [Wallet]
      description: |-
        After an acceptor requests a consumer to consent to a payment plan in the Wero digital wallet, the consumer can deny consent. The consumer might, for example, not agree with the proposed payment plan.

        The wallet informs EPI central services that the consumer has denied consent by making this endpoint call. The status of the consent resource changes to `Denied`.
